<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日 AI 情报站</title>
<meta name="description" content="每天自动汇总中文与英文来源的 AI 情报，含跨源事件聚合与可解释的重点推荐。">
<script>
// 主题必须在首次绘制前定好，否则会先闪一下深色再切浅色。
// 故这段刻意放在 <head> 里同步执行，而不是等下面主脚本的 DOMContentLoaded。
// 注意：键名 `ai-intel-theme` 与主脚本里的 STORE_KEYS.theme 是同一份字面量，改名要两处一起改。
(function () {
  var theme;
  try {
    theme = localStorage.getItem("ai-intel-theme");
    if (theme !== "light" && theme !== "dark") {
      theme = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches)
        ? "light" : "dark";
    }
  } catch (error) {
    theme = "dark";
  }
  document.documentElement.setAttribute("data-theme", theme);
})();
</script>
<style>
/* ============================================================
   设计语言：瑞士报刊编排（Editorial Ledger）
   浅色 = 未漂白书纸 + 炭墨 + 氧化赭石点缀；深色 = 黑曜石账本。
   两条铁律：① 一律 0 圆角；② 分区只靠 1px 发丝线，不用阴影。
   字体全部走本机字体栈 —— 设计稿原型的 Newsreader / JetBrains Mono /
   Inter 要经 Google Fonts 加载，本页必须零外部请求（双击可开、国内直连可用），
   故换成等价的衬线 / 等宽 / 无衬线系统栈，视觉意图不变。
   ============================================================ */

/* 深色是默认值；浅色由 `[data-theme="light"]` 覆盖。
   主题值一律由 JS 显式写到 <html> 上（含「跟随系统」的解析结果），
   这样调色板只需定义一份，不必在媒体查询里再复制一遍。 */
:root{
  color-scheme:dark;
  /* 字体：设计稿原型用 Google Fonts 的 Newsreader / JetBrains Mono / Inter，
     本页要求零外部请求（双击可开、国内直连可用），故换成等价系统栈。
     Latin 走 Georgia / Consolas / Segoe UI，中文字形按字回退到宋体 / 微软雅黑。
     注意：这三个变量必须在 :root 里声明 —— 缺一个，用到它的那条 font 简写就会
     在计算期整条失效（字号偷偷回落到浏览器默认 16px），页面上不会报错。 */
  --serif:Georgia,"Source Han Serif SC","Noto Serif CJK SC","Songti SC",SimSun,"Times New Roman",serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"JetBrains Mono","Courier New",SimSun,monospace;
  --sans:"Inter","Segoe UI",system-ui,-apple-system,"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;
  --bg:#111315; --bg-alt:#121416; --surface:#181a1c; --surface-low:#16181a;
  --surface-container:#1c1e21; --surface-high:#232629; --hover:#1a1c20;
  --fg:#e6e4df; --fg-2:#b0b2b7; --fg-dim:#84868c; --fg-faint:#5c5e64;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14); --line-strong:rgba(255,255,255,.26);
  --ink:#e6e4df; --on-ink:#111315;
  --rust:#c46a3b; --spruce:#4e7d67; --peach:#ffb693; --sage:#a0d1b8;
  --ok:#4e7d67; --warn:#c46a3b; --bad:#ffb4ab;
  --scrim:rgba(6,7,8,.68);
  --thumb-bg:#0c0e10;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#fbf9f4; --bg-alt:#f7f5ef; --surface:#ffffff; --surface-low:#f5f3ee;
  --surface-container:#f0eee9; --surface-high:#eae8e3; --hover:#faf9f6;
  --fg:#1b1c19; --fg-2:#3f413c; --fg-dim:#5f615c; --fg-faint:#8b8c86;
  --line:#e5e2da; --line-2:#d8d3c8; --line-strong:#b8b2a4;
  --ink:#111110; --on-ink:#fbf9f4;
  --rust:#934a24; --spruce:#233e33; --peach:#76340e; --sage:#334c40;
  --ok:#2e473b; --warn:#8a431d; --bad:#ba1a1a;
  --scrim:rgba(27,28,25,.42);
  --thumb-bg:#11110f;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:400 13px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
::selection{background:var(--fg); color:var(--bg)}
:focus-visible{outline:none; border-color:var(--fg) !important}
/* 设计稿是「零圆角 + 发丝线」，滚动条也一并收细，避免破坏版面节奏 */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--line-2);border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--line-strong)}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

.wrap{max-width:1400px;margin:0 auto;padding:0 24px}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.01em}
.serif{font-family:var(--serif)}
.spacer{flex:1 1 auto}

/* ---------------- 报头（Masthead） ---------------- */
.masthead{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 95%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.mast-in{display:flex;align-items:center;justify-content:space-between;gap:18px;min-height:52px;padding:8px 24px}
.mast-left{display:flex;align-items:baseline;gap:18px;min-width:0}
.brand{display:flex;align-items:baseline;gap:10px;flex-shrink:0}
.brand-name{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:-.01em;line-height:1}
.edition{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--fg-dim);text-transform:uppercase}
.telemetry{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;
  color:var(--fg-2);padding-left:16px;border-left:1px solid var(--line);min-width:0}
.telemetry .sep{color:var(--fg-faint)}
.telemetry b{color:var(--fg);font-weight:500}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--fg-dim);flex-shrink:0}
.dot.ok{background:var(--ok)}
.dot.warn{background:var(--warn)}
.dot.bad{background:var(--bad)}
.mast-right{display:flex;align-items:center;gap:14px;flex-shrink:0}
.searchbox{position:relative;display:flex;align-items:center}
.searchbox svg{position:absolute;left:8px;width:13px;height:13px;color:var(--fg-dim);pointer-events:none}
.searchbox input{
  width:190px;height:28px;padding:0 44px 0 26px;font:400 12px var(--sans);
  background:transparent;border:1px solid var(--line-2);border-radius:0;color:var(--fg);
}
.searchbox input::placeholder{color:var(--fg-dim)}
.searchbox input:focus{border-color:var(--fg);background:var(--surface);outline:none}
.kbd{position:absolute;right:6px;font-family:var(--mono);font-size:9px;color:var(--fg-dim);
  border:1px solid var(--line-2);background:var(--surface-low);padding:1px 4px;pointer-events:none}
.readmeter{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--fg-2);
  padding-left:16px;border-left:1px solid var(--line)}
.readmeter .bar{width:52px;height:3px;background:var(--surface-high)}
.readmeter .bar i{display:block;height:100%;background:var(--fg);width:0}
.readmeter b{color:var(--fg);font-weight:500}
.mast-actions{display:flex;align-items:center;gap:2px}
.icon-btn{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;
  color:var(--fg-2);border:1px solid transparent}
.icon-btn:hover{color:var(--fg);background:var(--surface-container)}
.icon-btn svg{width:15px;height:15px}
.i-sun{display:none}
:root[data-theme="light"] .i-moon{display:none}
:root[data-theme="light"] .i-sun{display:block}

/* ---------------- 区块标题（Section Deck） ---------------- */
.deck{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:16px}
.deck-left{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.deck h2{font-family:var(--serif);font-size:24px;font-weight:500;letter-spacing:-.01em;margin:0;color:var(--fg)}
.deck-sub{font-size:12px;color:var(--fg-2)}
.deck-right{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--fg-2);white-space:nowrap}
.deck-right .sq{width:6px;height:6px;background:var(--fg);display:inline-block}

/* ---------------- 今日重点：非对称头条版式 ---------------- */
/* 网格保持默认 stretch：特稿与侧栏等高，中间那条竖向分隔线才画得满一整行
   （改成 align-items:start 会让分隔线只画到特稿内容的高度，看着像断线）。
   特稿自身的留白不靠拉伸撑，而靠「同一事件的其他来源」这段真内容去填。 */
.lead-grid{display:grid;grid-template-columns:1fr;border:1px solid var(--line);background:var(--surface)}
@media (min-width:1024px){
  .lead-grid{grid-template-columns:repeat(12,1fr)}
  .lead-hero{grid-column:span 7;border-right:1px solid var(--line)}
  .lead-side{grid-column:span 5}
}
/* 特稿配图：16:9 裁切，高度由宽度决定，两种版式下都不会忽高忽低 */
.lead-fig{margin:0;border:1px solid var(--line);overflow:hidden}
.lead-fig img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
/* 无配图时给一行克制的说明，而不是留一块看不出所以然的空白 */
.lead-noimg{display:block;font-family:var(--mono);font-size:11px;color:var(--fg-faint);
  border:1px dashed var(--line-2);padding:6px 8px}
/* 特稿摘要不裁行数：头条的摘要该让人读完一句话，而不是掐成两行 */
.lead-hero .lead-sum{display:block;overflow:visible;-webkit-line-clamp:unset}
/* 同题报道清单：特稿成为头条的主要理由就是「多家来源交叉」，
   那就把这几家当场列出来（真数据，不是装饰），顺带把版面撑实。 */
.lead-cross{margin-top:auto;border-top:1px dashed var(--line-2);padding-top:10px}
.lead-cross-h{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--fg-faint);
  margin-bottom:6px}
.lead-cross-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lead-cross-list li{display:flex;align-items:baseline;gap:8px;font-size:12px}
.lead-cross-list .src{font-family:var(--mono);font-size:10px;color:var(--fg-dim);flex-shrink:0;
  border:1px solid var(--line);padding:1px 5px}
.lead-cross-list .cross-title{color:var(--fg-2);flex:1 1 auto;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.lead-cross-list .cross-title:hover{color:var(--fg)}
.lead-cross-list .t{font-family:var(--mono);font-size:10px;color:var(--fg-faint);flex-shrink:0}
.lead-hero{display:flex;flex-direction:column;justify-content:space-between;
  padding:24px 26px;border-bottom:1px solid var(--line);transition:background .15s}
@media (min-width:1024px){.lead-hero{border-bottom:0}}
.lead-hero:hover{background:var(--hover)}
.lead-no{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;
  font-family:var(--mono);font-size:11px;color:var(--fg-2);margin-bottom:12px}
.lead-no .who{display:flex;align-items:center;gap:8px;min-width:0}
.lead-no .no{font-weight:600;color:var(--fg);text-decoration:underline;
  text-decoration-color:var(--line-strong);text-underline-offset:4px}
.lead-no .pts{font-weight:600;color:var(--fg)}
.lead-hero h3{font-family:var(--serif);font-size:27px;line-height:1.28;font-weight:400;
  letter-spacing:-.01em;margin:0 0 12px;color:var(--fg)}
@media (min-width:768px){.lead-hero h3{font-size:31px}}
.lead-hero:hover h3{color:var(--fg-2)}
.lead-hero .sum{font-family:var(--serif);font-size:15px;line-height:1.7;color:var(--fg-2);margin:0 0 16px}
@media (min-width:768px){.lead-hero .sum{font-size:16px}}
.cross-note{font-size:11px;color:var(--fg-2);background:var(--surface-container);padding:2px 6px;flex-shrink:0}
/* 配图只在来源 feed 本来就带图时出现（本期 27.4% 的条目有图）。
   没有就整块不渲染 —— 绝不为了凑版面去抓文章页或塞占位大图。 */
.figure{border:1px solid var(--line);background:var(--thumb-bg);overflow:hidden;margin:0 0 16px}
.figure img{width:100%;height:auto;max-height:300px;object-fit:cover;object-position:center}
.figure figcaption{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:6px 10px;background:var(--surface-low);border-top:1px solid var(--line);
  font-family:var(--mono);font-size:10px;color:var(--fg-2)}
.lead-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;
  padding-top:16px;border-top:1px solid var(--line)}
.tags{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-family:var(--mono);font-size:11px}
.tag-btn{color:var(--fg-2);border:0;padding:0}
.tag-btn:hover{color:var(--fg)}
.tags .sep{color:var(--fg-faint)}
.dispatch{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;
  font-weight:500;color:var(--fg)}
.dispatch:hover{text-decoration:underline;text-underline-offset:4px}
.dispatch svg{width:13px;height:13px}
/* 侧栏 #02–#05：一条发丝线分隔，不再逐块加边框。
   桌面端按特稿高度等分：每条被拉满、内容垂直居中，多出来的空间均匀落在每条上下。
   不这么做时，侧栏内容短于带图特稿，差的 240px 会在右栏底部攒成一整块纯背景空洞。 */
.lead-side{display:flex;flex-direction:column}
.lead-side>*+*{border-top:1px solid var(--line)}
@media (min-width:1024px){
  .lead-side>.lead-item,.lead-side>.lead-mini{flex:1 1 0}
  .lead-side>.lead-item,.lead-side>.lead-mini>.lead-item{
    display:flex;flex-direction:column;justify-content:center}
}
.lead-item{padding:18px 20px;transition:background .15s}
.lead-item:hover{background:var(--hover)}
.lead-item .row{display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-family:var(--mono);font-size:11px;color:var(--fg-2);margin-bottom:8px}
.lead-item .row .idx{font-weight:600;color:var(--fg)}
.lead-body{display:flex;gap:14px}
.lead-body .txt{flex:1 1 auto;min-width:0}
.lead-item h4{font-family:var(--serif);font-size:16px;line-height:1.45;font-weight:500;
  margin:0 0 6px;color:var(--fg)}
.lead-item:hover h4{color:var(--fg-2)}
.lead-item p{font-size:12px;line-height:1.7;color:var(--fg-2);margin:0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lead-thumb{width:112px;height:80px;flex-shrink:0;border:1px solid var(--line);
  background:var(--thumb-bg);overflow:hidden}
.lead-thumb img{width:100%;height:100%;object-fit:cover;object-position:center}
.lead-mini{display:grid;grid-template-columns:1fr}
@media (min-width:640px){.lead-mini{grid-template-columns:1fr 1fr}}
.lead-mini>*+*{border-top:1px solid var(--line)}
@media (min-width:640px){
  .lead-mini>*+*{border-top:0;border-left:1px solid var(--line)}
  .lead-mini>*:nth-child(2n){border-left:0}
}
.lead-mini .lead-item{padding:14px 16px}
.lead-mini h5{font-family:var(--serif);font-size:15px;line-height:1.45;font-weight:500;margin:0 0 6px;
  color:var(--fg);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lead-mini .lead-item:hover h5{color:var(--fg-2)}
.lead-mini .sig{font-family:var(--mono);font-size:10px;color:var(--fg-2);margin-top:8px}
/* ---------------- 编排控制台：账本行 + 分类页签 + 检索算符 ---------------- */
.console{border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  background:var(--surface);padding:12px 0;margin-top:32px}
.console-in{padding:0 24px}
.ledger{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;
  font-family:var(--mono);font-size:11px;color:var(--fg-2)}
.ledger-l{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-width:0}
.ledger-l .sep{color:var(--fg-faint)}
.ledger-l b{color:var(--fg);font-weight:500}
.ledger-actions{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
/* 页签即按钮：当前项用实心墨块，其余透明 —— 与设计稿的主/次按钮规则一致 */
.tabs{display:flex;flex-wrap:wrap;align-items:center;gap:1px;font-family:var(--mono);font-size:11px;
  padding-top:10px;border-top:1px solid var(--line);margin-top:10px}
.tab{padding:4px 12px;color:var(--fg-2);white-space:nowrap}
.tab:hover{color:var(--fg);background:var(--surface-container)}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);font-weight:500}
.tab .n{color:var(--fg-faint);margin-left:6px}
.tab[aria-pressed="true"] .n{color:inherit;opacity:.75}
.ops{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;
  padding-top:10px}
.ops .sep{color:var(--fg-faint)}
.check{display:inline-flex;align-items:center;gap:6px;color:var(--fg-2);cursor:pointer;user-select:none}
.check:hover{color:var(--fg)}
.check input{appearance:none;width:13px;height:13px;border:1px solid var(--line-strong);
  border-radius:0;background:transparent;margin:0;cursor:pointer;position:relative}
.check input:checked{background:var(--ink);border-color:var(--ink)}
.check input:checked::after{content:"";position:absolute;inset:3px;background:var(--on-ink)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);
  background:var(--surface-low);color:var(--fg-2);padding:2px 7px}
.chip:hover{color:var(--fg);border-color:var(--line-strong)}
/* 分类页签是「文字页签」：默认无边框，靠字重与底色区分，选中项填充墨色 */
#filters .chip{padding:4px 12px;background:transparent;border-color:transparent}
/* 选中态与悬停必须带 id 前缀：`#filters .chip`（id+类）会盖掉 `.tab[aria-pressed]`（类+属性），
   不加这两条，选中页签的文字色会落到 --on-ink 而填充色被吃成透明 —— 深色主题下等于隐形。 */
#filters .chip:hover{color:var(--fg)}
#filters .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
/* 源表里的来源名做成下划线链接样：点它即筛到该来源 */
#srcBody .chip{border:0;padding:0;background:none;color:var(--fg);text-decoration:underline;
  text-decoration-style:dotted;text-decoration-color:var(--fg-dim);text-underline-offset:3px}
#srcBody .chip:hover{text-decoration-color:var(--fg)}
/* 账本行的操作组靠右：`.acts` 吃掉左侧剩余空间 */
.ledger-l .acts{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
/* 卡片正文：文字列自适应、缩略图盒子固定 —— 列宽不因有无配图而跳动 */
.card-main{display:flex;align-items:flex-start;gap:12px}
.card-txt{flex:1 1 auto;min-width:0}
.hero-sec{padding-top:28px}
/* 报头主标题是 h1：抹掉 UA 默认外边距，视觉上仍只是报头里那一行刊名 */
h1.brand-name{margin:0;font-weight:600}
.ops select{appearance:none;background:transparent;border:1px solid var(--line-2);border-radius:0;
  font-family:var(--mono);font-size:11px;color:var(--fg);padding:3px 26px 3px 8px;cursor:pointer}
.ops select:focus{border-color:var(--fg);outline:none}
.ops .selwrap{position:relative;display:inline-flex;align-items:center}
.ops .selwrap svg{position:absolute;right:6px;width:12px;height:12px;color:var(--fg-dim);pointer-events:none}
.countline{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;

.cards{list-style:none;margin:24px 0 0;padding:0;display:grid;grid-template-columns:1fr;

</style>
</head>

<script>
"use strict";
/* 数据内联点。build_site.py 按下面这个字面量定位并替换成 {news, meta, runs, status}；
   常量名与 placeholder 必须逐字一致，改一处就要改两处（`build_site.py --check` 会卡住漏改）。
   在 web/ 下单独打开模板时它是 null —— 此时走 fetch 兜底（dist/ 整体作为静态站目录时用）。 */
const INLINE_DATA = /*__INLINE_DATA__*/ null;

const DATA_FILES = {
  news: "data/news.json",
  meta: "data/meta.json",
  runs: "data/runs.json",
  status: "data/update-status.json",
};

/* localStorage 键名。`ai-intel-last-visit` 与 `ai-intel-read` 两个字面量被
   tools/verify_ui.py 的回访 harness 直接读写，改名必须同步改脚本，
   否则「刷新后已读仍保留」这条验证会静默失效（脚本读不到键就当成首次访问）。 */
const STORE_KEYS = {
  theme: "ai-intel-theme",
  lastVisit: "ai-intel-last-visit",
  read: "ai-intel-read",
  bookmark: "ai-intel-bookmark",
};

const HOUR = 3600e3, DAY = 24 * HOUR;

/* 分类页签。数字一律在浏览器里现算，不读 data/*.json 的 counts —— 这样页签上的
   数字与列表实际条数永远同源，不会出现「页签写 111、点进去只有 108」的口径漂移。 */
const FILTERS = [
  { key: "all", text: "全部" },
  { key: "zh", text: "中文" },
  { key: "en", text: "英文" },
  { key: "official", text: "官方源" },
  { key: "cluster", text: "多来源报道" },
  { key: "today", text: "今天" },
  { key: "week", text: "近 7 天" },
];

const state = {
  filter: "zh",   // 默认中文：本站以中文语境为主，英文源作为补充，不混排
  q: "",
  src: null,      // 精确到 source_name_en
  why: null,      // 精确到 reasons 里的某一条原文
  cluster: null,  // 跨源事件簇 id
  clusterLabel: null,  // 跨源筛选沿用的理由原文（指示条里要有它，读者才知道在筛什么）
  dup: false,     // 列表是否重复显示「今日重点」条目
  unreadOnly: false,
  bookmarkOnly: false,
  sort: "score",
};

/* 阅读账本。已读集合与「只看未读」共用同一份数据，不存在两套口径。 */
const visitState = { lastVisit: null, read: new Set(), bookmarks: new Set(), newCount: 0, hasPrev: false };

let DATA = null;   // {news, meta, runs, status}

/* ---------------- 小工具 ---------------- */
const $ = (id) => document.getElementById(id);

/* 一律用 createElement + textContent 组装 DOM，不拼 innerHTML：
   标题/摘要/来源名都来自外部 feed，拼字符串等于把注入面留给上游。 */
function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}
function button(cls, text, aria) {
  const node = el("button", cls, text);
  node.type = "button";
  if (aria) node.setAttribute("aria-label", aria);
  return node;
}
function link(cls, text, href) {
  const node = el("a", cls, text);
  node.href = href;
  return node;
}
function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

/* ---------------- 时间：一律按北京时区（UTC+8）呈现 ---------------- */
function parseTime(value) {
  const ms = Date.parse(value || "");
  return Number.isFinite(ms) ? ms : null;
}
const p2 = (n) => String(n).padStart(2, "0");
function beijing(ms) {
  const d = new Date(ms + 8 * HOUR);  // 固定偏移：中国大陆不实行夏令时，无需时区库
  return { y: d.getUTCFullYear(), mo: d.getUTCMonth() + 1, d: d.getUTCDate(),
           h: d.getUTCHours(), mi: d.getUTCMinutes() };
}
function fmtStamp(ms) {
  if (ms == null) return "时间未知";
  const t = beijing(ms);
  return `${t.y}-${p2(t.mo)}-${p2(t.d)} ${p2(t.h)}:${p2(t.mi)}`;
}
function editionOf(ms) {
  if (ms == null) return "EDITION // —";
  const t = beijing(ms);
  return `EDITION // ${t.y}.${t.mo} · 第 ${Math.floor((ms - Date.UTC(t.y, 0, 1)) / DAY) + 1} 期`;
}
/* 相对时间用「此刻」而不是数据生成时刻：读者关心的是「离我多久」。
   但窗口类筛选（今天 / 近 7 天）用 generated_at 作基准，口径才与管线一致。 */
function relTime(ms, now) {
  if (ms == null) return "时间未知";
  const diff = now - ms;
  if (diff < 60e3) return diff < 0 ? "刚刚" : "1 分钟内";
  const min = Math.floor(diff / 60e3);
  if (min < 60) return `${min} 分钟前`;
  const h = Math.floor(min / 60);
  if (h < 24) return `${h} 小时前`;
  const d = Math.floor(h / 24);
  if (d < 30) return `${d} 天前`;
  return fmtStamp(ms).slice(0, 10);
}

/* ---------------- 来源视觉标识（纯本地推导，不引任何图标库） ----------------
   色相由来源 id 哈希得出：同一个源在任何位置颜色都一致，无需配置表。 */
function hueOf(seed) {
  let h = 0;
  for (const ch of String(seed || "?")) h = (h * 31 + ch.codePointAt(0)) % 360;
  return h;
}
function monogram(name) {
  const words = String(name || "?").replace(/[^A-Za-z0-9 ]/g, " ").trim().split(/\s+/).filter(Boolean);
  if (!words.length) return "??";
  if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
  return (words[0][0] + words[1][0]).toUpperCase();
}

/* ---------------- 本地存储：全部只写本机浏览器，不上传 ---------------- */
function storeGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
function storeSet(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* 隐私模式下静默降级为不记忆 */ } }
function readSet(key) {
  try {
    const raw = JSON.parse(storeGet(key) || "[]");
    return new Set(Array.isArray(raw) ? raw : []);
  } catch (e) { return new Set(); }
}
const saveSet = (key, set) => storeSet(key, JSON.stringify([...set]));

function loadVisitState(news) {
  visitState.read = readSet(STORE_KEYS.read);
  visitState.bookmarks = readSet(STORE_KEYS.bookmark);
  const stored = parseTime(storeGet(STORE_KEYS.lastVisit));
  visitState.lastVisit = stored;
  visitState.hasPrev = stored != null;
  // 「新增」口径 = 入库时间（first_seen_at）晚于上次来访，且你还没读过。
  // 用入库时间而不是发布时间：「上次来访之后才被我们收进来的」才算新增，
  // 与管线的时间戳语义一致。已读的排除在外，否则每次刷新都会被同一批条目再提醒一遍。
  visitState.newCount = stored == null ? 0
    : news.articles.filter((a) => {
        const t = parseTime(a.first_seen_at);
        return t != null && t > stored && !visitState.read.has(a.id);
      }).length;
}
const isRead = (a) => visitState.read.has(a.id);
const isBookmarked = (a) => visitState.bookmarks.has(a.id);

/* ---------------- 主题 ---------------- */
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  storeSet(STORE_KEYS.theme, theme);
}
function toggleTheme() {
  applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
}

/* ---------------- 数据装载与兜底 ---------------- */
async function loadData() {
  if (INLINE_DATA) return INLINE_DATA;
  const payload = {};
  for (const [key, path] of Object.entries(DATA_FILES)) {
    try {
      const res = await fetch(path, { cache: "no-store" });
      payload[key] = res.ok ? await res.json() : null;
    } catch (e) { payload[key] = null; }
  }
  return payload;
}

/* 走到这里说明数据真的没拿到。诚实报错，不渲染半页假内容。 */
function fail(title, detail) {
  const box = el("div", "err");
  box.appendChild(el("b", null, title));
  if (detail) box.appendChild(el("span", null, " —— " + detail));
  box.appendChild(el("div", null, "请先运行 python collect.py 生成 data/news.json，或直接用 dist/index.html（数据已内联）。"));
  const host = $("cards");
  clear(host);
  const li = el("li");
  li.appendChild(box);
  host.appendChild(li);
}
/* ---------------- 报头：只回答三个问题 ---------------- */
/* 顶栏不是运维大盘。读者只关心：整站可不可信、数据新不新、有多少条。
   成功率、来源健康分布、配图率这类维护者指标全部下移到页面下方的「信息源状态与运行记录」。 */
function overallStatus(status) {
  const h = (status && status.health) || {};
  const failed = h.failed || 0;
  const warn = (h.stale || 0) + (h.parse_warning || 0);
  if (!status) return { text: "整体状态：运行记录缺失", dot: "warn" };
  if (failed) return { text: `整体状态：${failed} 个信源本次抓取失败`, dot: "bad" };
  if (warn) return { text: `整体状态：${warn} 个信源需留意`, dot: "warn" };
  return { text: "整体状态：全部信源正常", dot: "ok" };
}

function renderHeader(data) {
  const news = data.news, status = data.status;
  const gen = parseTime(news.generated_at);

  const edition = $("edition");
  if (edition) edition.textContent = editionOf(gen);

  const health = $("health");
  if (health) {
    clear(health);
    const st = overallStatus(status);
    const pill1 = el("span", "pill");
    pill1.appendChild(el("span", "dot " + st.dot));
    pill1.appendChild(el("span", null, st.text));
    health.appendChild(pill1);                                   // ① 整站是否可信
    health.appendChild(el("span", "pill", `最后更新 ${fmtStamp(gen)}（北京时间）`));  // ② 数据新不新
    health.appendChild(el("span", "pill", `共 ${news.articles.length} 条`));          // ③ 有多少条
  }
  renderReadMeter(data);
}

/* 阅读进度是读者自己的账，不是全站指标，所以放在报头右侧而不是状态栏。 */
function renderReadMeter(data) {
  const host = $("readMeter");
  if (!host) return;
  const total = data.news.articles.length;
  const read = data.news.articles.filter(isRead).length;
  const pct = total ? Math.round((read / total) * 100) : 0;
  clear(host);
  host.appendChild(el("span", "rm-l", "已读"));
  host.appendChild(el("b", "rm-n", String(read)));
  host.appendChild(el("span", "rm-l", `/ ${total}`));
  const bar = el("span", "bar");
  bar.setAttribute("role", "img");
  bar.setAttribute("aria-label", `已读进度 ${pct}%`);
  const fill = el("i");
  fill.style.width = pct + "%";
  bar.appendChild(fill);
  host.appendChild(bar);
}

/* ---------------- 今日重点：主编特稿 + 侧栏（非对称版式） ---------------- */
/* meta.highlights 只给 article_id 与遴选理由，标题/配图要回 news.articles 里取。
   合并时「重点条目」的字段优先，缺失的（配图、摘要）再从文章补齐。 */
function metaHighlights(data) {
  const byId = new Map(data.news.articles.map((a) => [a.id, a]));
  return ((data.meta && data.meta.highlights) || []).map((h) => {
    const a = byId.get(h.article_id) || {};
    return Object.assign({}, a, h, {
      title: h.title || a.title,
      url: h.url || a.url,
      summary: h.summary || a.summary,
      image_url: h.image_url || a.image_url,
      published_at: h.published_at || a.published_at,
      source_name_en: h.source_name_en || a.source_name_en,
    });
  }).sort((a, b) => (Number(b.score) || 0) - (Number(a.score) || 0));
}

/* 遴选理由做成可点的窄标签：点了就按这条理由筛列表。
   注意标签文字必须与 reasons 里的原文逐字一致（后过滤靠它精确匹配），
   前面的 `#` 只由 CSS 的 ::before 生成，不进 textContent。 */
/* 「今日重点」的 reasons 是上游为读者改写过的一版（`命中多重信号：X、Y`、`N 个独立来源同时报道`），
   而条目数据里存的是规则名（`涉及X、Y`、`N 个独立来源报道`）。拿显示文字直接去筛会筛出 0 条 ——
   点不出结果的按钮比不可点更糟，所以显示与筛选都先归一到规则名，让「点的是什么」就是「筛的是什么」。 */
const REASON_ALIAS = [
  [/^命中多重信号[：:]\s*(.+)$/, "涉及$1"],
  [/^(\d+)\s*个独立来源同时报道$/, "$1 个独立来源报道"],
];
function reasonKey(reason) {
  const r = String(reason == null ? "" : reason).trim();
  for (const [re, rep] of REASON_ALIAS) if (re.test(r)) return r.replace(re, rep);
  return r;
}
let _reasonKeys = null;
function allReasonKeys() {
  if (!_reasonKeys) {
    _reasonKeys = new Set();
    DATA.news.articles.forEach((a) => (a.reasons || []).forEach((r) => _reasonKeys.add(reasonKey(r))));
  }
  return _reasonKeys;
}

function reasonChips(item) {
  const reasons = [...new Set((item.reasons || []).map(reasonKey))];
  const clusterish = (r) => /独立来源/.test(r);
  // 跨源理由排在最前：它是「这一条为什么值得读」里信息量最大的一句
  reasons.sort((a, b) => (clusterish(b) ? 1 : 0) - (clusterish(a) ? 1 : 0));
  return reasons.map((reason) => {
    const chip = button("why", reason);
    if (!allReasonKeys().has(reason)) {
      // 这类理由在条目数据里查不到同名字段：不做成按钮，只当说明陈列（并写明为什么不可点）
      chip.disabled = true;
      chip.title = `「${reason}」在条目数据里没有同名字段，不作筛选入口`;
      return chip;
    }
    chip.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      applyReasonFilter(reason);
    });
    return chip;
  });
}

function applyReasonFilter(reason) {
  const key = reasonKey(reason);
  if (/独立来源/.test(key)) {
    const hit = metaHighlights(DATA).find((h) => (h.reasons || []).map(reasonKey).includes(key));
    // 查不到对应重点条目时退回「按理由筛」，不许留下点不出结果的空筛选
    state.cluster = hit ? hit.cluster_id : null;
    state.clusterLabel = key;
    state.why = hit ? null : key;
  } else {
    state.why = key;
    state.cluster = null;
  }
  // 从重点区点进来，必然要看那条被默认略过的重点条目：自动打开「列表含重点条目」
  state.dup = true;
  renderAll(Date.now());
  const section = $("listSection");
  if (section && section.scrollIntoView) section.scrollIntoView({ behavior: "smooth", block: "start" });
}

function leadMeta(item, index, now) {
  const row = el("div", "lead-meta");
  row.appendChild(el("span", "no", `NO.${p2(index + 1)}`));
  row.appendChild(el("span", "pts", (Number(item.score) || 0).toFixed(2)));
  row.appendChild(el("span", "sep", "·"));
  const src = button("hl-src", item.source_name_en, `来源：${item.source_name_en}`);
  src.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); applySourceFilter(item.source_name_en); });
  row.appendChild(src);
  row.appendChild(el("span", "t", `· ${relTime(parseTime(item.published_at), now)}`));
  const others = Number(item.independent_sources || 0);
  if (others > 1) row.appendChild(el("span", "xref", `${others} 个独立来源`));
  else if (item.cluster_id != null) row.appendChild(el("span", "xref", "多来源交叉"));
  return row;
}

/* 特稿为什么是特稿？多数时候因为「多家来源在同一天报了同一件事」。
   那就把另外几家当场列出来：同行标题、各自来源、各自时间（全是 feed 里的真数据），
   点击进原文。这一段同时回答两个问题：凭什么它是头条、以及我能自己去核对。 */
function leadCross(item) {
  if (item.cluster_id == null) return null;
  const others = membersOf(item.cluster_id, DATA).filter((a) => a.id !== item.id);
  if (!others.length) return null;
  const box = el("div", "lead-cross");
  box.appendChild(el("div", "lead-cross-h", `同一事件的其他来源报道（${others.length} 家）`));
  const list = el("ul", "lead-cross-list");
  others.forEach((a) => {
    const li = el("li");
    li.appendChild(el("span", "src", a.source_name_en));
    const t = link("cross-title", a.title || "(无标题)", a.url);
    t.target = "_blank";
    t.rel = "noopener noreferrer";
    t.addEventListener("click", () => setRead(a, null));
    li.appendChild(t);
    li.appendChild(el("span", "t", relTime(parseTime(a.published_at), Date.now())));
    list.appendChild(li);
  });
  box.appendChild(list);
  return box;
}

function leadHero(item, now) {
  const hero = el("article", "lead-hero hl");
  hero.appendChild(leadMeta(item, 0, now));
  const h = el("h3");
  h.appendChild(link(null, item.title || "(无标题)", item.url));
  hero.appendChild(h);
  if (item.summary) hero.appendChild(el("p", "lead-sum", item.summary));
  hero.appendChild(leadFigure(item));
  const cross = leadCross(item);
  if (cross) hero.appendChild(cross);
  const foot = el("div", "lead-foot");
  const tags = el("span", "tags");
  reasonChips(item).forEach((c) => tags.appendChild(c));
  foot.appendChild(tags);
  foot.appendChild(link("dispatch", "读原文 →", item.url));
  hero.appendChild(foot);
  return hero;
}

/* 配图只从 feed 载荷里已有的字段取，永不为了配图再去请求文章页 —— 
   首页 234 条若逐条抓 og:image 就是 234 次外部请求，静态站不该有这种隐式代价。 */
function leadFigure(item) {
  if (!item.image_url) return el("span", "lead-noimg", "本条无配图（来源 feed 未提供图片地址）");
  const fig = el("figure", "lead-fig");
  const img = el("img");
  img.src = item.image_url;
  img.alt = "";
  img.loading = "lazy";
  img.referrerPolicy = "no-referrer";
  // 图片失效时整块收起，不留破图标：展示一张错图比不展示更糟
  img.addEventListener("error", () => { fig.remove(); });
  fig.appendChild(img);
  fig.appendChild(el("figcaption", null, "配图取自来源 feed 载荷，未额外请求文章页"));
  return fig;
}

function leadSideItem(item, index, now, compact) {
  const box = el("article", "lead-item hl" + (compact ? " compact" : ""));
  box.appendChild(leadMeta(item, index, now));
  const h = el(compact ? "h5" : "h4");
  h.appendChild(link(null, item.title || "(无标题)", item.url));
  box.appendChild(h);
  if (item.summary) box.appendChild(el("p", "lead-sum", item.summary));
  const foot = el("div", "lead-foot");
  const tags = el("span", "tags");
  reasonChips(item).slice(0, compact ? 1 : 2).forEach((c) => tags.appendChild(c));
  foot.appendChild(tags);
  if (!compact && item.image_url) {
    const thumb = el("span", "lead-thumb");
    const img = el("img");
    img.src = item.image_url; img.alt = ""; img.loading = "lazy"; img.referrerPolicy = "no-referrer";
    img.addEventListener("error", () => { thumb.remove(); });
    thumb.appendChild(img);
    foot.appendChild(thumb);
  }
  box.appendChild(foot);
  return box;
}

function renderHighlights(data, now) {
  const host = $("highlights");
  if (!host) return;
  const items = metaHighlights(data);
  clear(host);
  if (!items.length) {
    host.appendChild(el("p", "hl-empty", "本次运行没有产出「今日重点」条目。"));
    return;
  }
  const minScore = Math.min(...items.map((h) => Number(h.score) || 0));
  const sub = $("hlSub");
  if (sub) sub.textContent = `综合评分 ≥ ${minScore.toFixed(2)} 的高权重事件 · 头条取其中配图可用且分数最高的一条 · 评分由本地规则计算，非模型生成`;
  const count = $("hlCount");
  if (count) count.textContent = `LEAD STORIES / ${items.length} SELECTED`;

  // 头条必须有配图：items 已按分数降序排好，取「有配图」中分数最高的一条当头条；
  // 只有当重点条目全都没有配图时，才退回分数最高者（此时特稿会如实标注本条无配图）。
  const leadAt = items.findIndex((it) => it.image_url);
  const heroAt = leadAt >= 0 ? leadAt : 0;
  host.appendChild(leadHero(items[heroAt], now));
  const rest = items.filter((_, i) => i !== heroAt);
  const side = el("div", "lead-side");
  rest.slice(0, 2).forEach((item, i) => side.appendChild(leadSideItem(item, i + 1, now, false)));
  const tail = rest.slice(2);
  if (tail.length) {
    const mini = el("div", "lead-mini");
    tail.forEach((item, i) => mini.appendChild(leadSideItem(item, i + 3, now, true)));
    side.appendChild(mini);
  }
  host.appendChild(side);
}

/* ---------------- 跨源浮层：把「同一件事的多家报道」逐条摊开 ---------------- */
function membersOf(clusterId, data) {
  return data.news.articles
    .filter((a) => a.cluster_id === clusterId)
    .sort((a, b) => (parseTime(b.published_at) || 0) - (parseTime(a.published_at) || 0));
}

function openCluster(clusterId, label) {
  const data = DATA;
  if (!data || clusterId == null) return;
  const members = membersOf(clusterId, data);
  if (!members.length) return;
  const modal = $("modal");
  if (!modal) return;
  const title = $("modalTitle");
  if (title) title.textContent = label || `跨源事件 · ${members.length} 条同题报道`;
  const body = $("modalBody");
  clear(body);
  members.forEach((a, i) => {
    const row = el("div", "modal-item");
    row.appendChild(el("span", "mi-no", p2(i + 1)));
    row.appendChild(el("span", "mi-src", a.source_name_en));       // 每行一个来源，可逐条核对
    row.appendChild(link("mi-title", a.title || "(无标题)", a.url));
    row.appendChild(el("span", "mi-time", relTime(parseTime(a.published_at), Date.now())));
    body.appendChild(row);
  });
  const note = $("modalNote");
  if (note) note.textContent =
    `同一事件的不同来源报道逐条列出（按发布时间倒序），共 ${members.length} 条。` +
    `相似度阈值与判据由本地规则给出，未调用任何外部接口。`;
  modal.hidden = false;
  document.body.classList.add("modal-open");
}

function closeModal() {
  const modal = $("modal");
  if (modal) modal.hidden = true;
  document.body.classList.remove("modal-open");
}

function applySourceFilter(name) {
  state.src = name;
  state.dup = true;   // 重点区里的条目默认不在列表里，筛来源时要让人看得到
  renderAll(Date.now());
}
/* ---------------- 筛选与排序 ---------------- */
/* 窗口类判据以 generated_at 为基准（而不是浏览器此刻）：这样「今天」页签的
   数字与列表条数在任何时候打开都稳定，不会因为隔天再打开就自己变少。 */
function windowBase() {
  const ms = parseTime(DATA && DATA.news && DATA.news.generated_at);
  return ms == null ? Date.now() : ms;
}
function inWindow(a, hours) {
  const t = parseTime(a.published_at);
  return t != null && windowBase() - t <= hours * HOUR;
}
const FILTER_PREDICATES = {
  all: () => true,
  zh: (a) => a.lang === "zh",
  en: (a) => a.lang === "en",
  official: (a) => !!a.source_official,
  cluster: (a) => a.cluster_id != null,
  today: (a) => inWindow(a, 24),
  week: (a) => inWindow(a, 168),
};

let hlIds = new Set();
function computeHlIds() {
  hlIds = new Set((((DATA.meta || {}).highlights) || []).map((h) => h.article_id));
}

function passes(a, now, ignoreDup) {
  if (!FILTER_PREDICATES[state.filter](a)) return false;
  if (state.src && a.source_name_en !== state.src) return false;
  if (state.cluster != null && a.cluster_id !== state.cluster) return false;
  if (state.why && !(a.reasons || []).includes(state.why)) return false;
  if (state.unreadOnly && isRead(a)) return false;
  if (state.bookmarkOnly && !isBookmarked(a)) return false;
  if (state.q) {
    const hay = `${a.title || ""} ${a.summary || ""} ${a.source_name_en || ""}`.toLowerCase();
    if (!hay.includes(state.q.toLowerCase())) return false;
  }
  // 默认把「今日重点」从列表里剔掉：同一件事不该在首屏出现两遍。
  // 想看时勾「列表含重点条目」，两张清单口径都写在条数行里，不让人猜。
  if (!ignoreDup && !state.dup && hlIds.has(a.id)) return false;
  return true;
}

function sortArticles(list) {
  const out = list.slice();
  const byTime = (a, b) => (parseTime(b.published_at) || 0) - (parseTime(a.published_at) || 0);
  const byScore = (a, b) => (Number(b.score) || 0) - (Number(a.score) || 0) || byTime(a, b);
  if (state.sort === "time") out.sort(byTime);
  else if (state.sort === "heat") out.sort((a, b) => (Number(b.heat) || 0) - (Number(a.heat) || 0) || byScore(a, b));
  else out.sort(byScore);
  return out;
}

/* ---------------- 分类页签 ---------------- */
/* 页签上的数字 = 点进去真能看到的条数（套用「重点条目是否重复显示」的口径）。 */
function filterCount(key) {
  return DATA.news.articles.filter((a) => {
    if (!FILTER_PREDICATES[key](a)) return false;
    return state.dup || !hlIds.has(a.id);
  }).length;
}

function renderTabs() {
  const host = $("filters");
  if (!host) return;
  clear(host);
  FILTERS.forEach((f) => {
    const chip = button("chip tab");
    chip.appendChild(el("span", "ct", f.text));
    chip.appendChild(el("span", "n", String(filterCount(f.key))));
    chip.setAttribute("aria-pressed", String(state.filter === f.key));
    chip.addEventListener("click", () => { state.filter = f.key; renderAll(Date.now()); });
    host.appendChild(chip);
  });
}

/* ---------------- 筛选条件指示条：所有收窄条件都可逐个摘掉 ---------------- */
function activeConditions() {
  const list = [];
  const f = FILTERS.find((x) => x.key === state.filter);
  if (state.filter !== "all" && f) list.push({ label: f.text, clear: () => { state.filter = "all"; } });
  if (state.src) list.push({ label: `来源：${state.src}`, clear: () => { state.src = null; } });
  if (state.cluster != null) {
    list.push({
      label: `跨源事件：${state.clusterLabel || "#" + state.cluster}`,
      clear: () => { state.cluster = null; state.clusterLabel = null; },
    });
  }
  if (state.why) list.push({ label: state.why, clear: () => { state.why = null; } });
  if (state.q) list.push({ label: `检索：${state.q}`, clear: () => { state.q = ""; const q = $("q"); if (q) q.value = ""; } });
  if (state.unreadOnly) list.push({ label: "只看未读", clear: () => { state.unreadOnly = false; } });
  if (state.bookmarkOnly) list.push({ label: "只看收藏", clear: () => { state.bookmarkOnly = false; } });
  if (state.dup) list.push({ label: "列表含重点条目", clear: () => { state.dup = false; } });
  return list;
}

function renderActiveFilters() {
  const host = $("activeFilters");
  if (!host) return;
  const conds = activeConditions();
  clear(host);
  if (!conds.length) { host.hidden = true; return; }   // 无条件时整行收起，不留空条
  host.hidden = false;
  host.appendChild(el("span", "af-label", "筛选中："));
  conds.forEach((c) => {
    const token = el("span", "af-token");
    token.appendChild(el("span", null, c.label));
    const x = button("af-x", "×", `移除条件：${c.label}`);
    x.addEventListener("click", () => { c.clear(); renderAll(Date.now()); });
    token.appendChild(x);
    host.appendChild(token);
  });
  const all = button("af-clear", "清空全部条件");
  all.addEventListener("click", clearAllFilters);
  host.appendChild(all);
}

function clearAllFilters() {
  state.filter = "all";
  state.q = "";
  state.src = null;
  state.why = null;
  state.cluster = null;
  state.clusterLabel = null;
  state.unreadOnly = false;
  state.bookmarkOnly = false;
  state.dup = false;
  const q = $("q"); if (q) q.value = "";
  const dup = $("dupToggle"); if (dup) dup.checked = false;
  renderAll(Date.now());
}

/* ---------------- 阅读账本（首访也显示） ----------------
   这一行是「功能可发现」的入口：藏起来就等于「只看未读 / 已读变淡」永远没人知道。
   首访说明这是第一次来，不显示「新增 0 篇」这种既没信息量又像出错的措辞。 */
function renderLedger() {
  const bar = $("visitBar");
  if (!bar) return;
  const articles = DATA.news.articles;
  const total = articles.length;
  const read = articles.filter(isRead).length;
  const bm = articles.filter(isBookmarked).length;
  clear(bar);
  const left = el("span", "led");
  if (visitState.hasPrev) {
    left.appendChild(el("span", null, "自上次来访"));
    left.appendChild(el("b", null, `新增 ${visitState.newCount} 篇未读`));
    left.appendChild(el("span", null, ` · 全站未读 ${total - read} 条`));
  } else {
    left.appendChild(el("span", null, `首次访问 · 全部 ${total} 条均为未读`));
  }
  left.appendChild(el("span", null, ` · 已读 ${read} 条 · 收藏 ${bm} 条（只记录在本机浏览器）`));
  bar.appendChild(left);

  const acts = el("span", "acts");
  const unreadBtn = button("chip", "只看未读");
  unreadBtn.setAttribute("aria-pressed", String(state.unreadOnly));
  unreadBtn.addEventListener("click", () => { state.unreadOnly = !state.unreadOnly; renderAll(Date.now()); });
  const bmBtn = button("chip", "只看收藏");
  bmBtn.setAttribute("aria-pressed", String(state.bookmarkOnly));
  bmBtn.addEventListener("click", () => { state.bookmarkOnly = !state.bookmarkOnly; renderAll(Date.now()); });
  const allBtn = button("chip", "全部标为已读");
  allBtn.addEventListener("click", markAllRead);
  acts.append(unreadBtn, bmBtn, allBtn);
  bar.appendChild(acts);
}

/* 已读标记是「就地改一个类」，不走整表重绘 —— 重绘会把读者点的那张卡片换掉，
   滚动位置和焦点都会跳。 */
function setRead(a, cardEl) {
  if (!visitState.read.has(a.id)) {
    visitState.read.add(a.id);
    saveSet(STORE_KEYS.read, visitState.read);
  }
  if (cardEl) cardEl.classList.add("read");
  renderLedger();
  renderReadMeter(DATA);
}

function markAllRead() {
  DATA.news.articles.forEach((a) => visitState.read.add(a.id));
  saveSet(STORE_KEYS.read, visitState.read);
  renderAll(Date.now());
}

function toggleBookmark(a, btn) {
  if (visitState.bookmarks.has(a.id)) visitState.bookmarks.delete(a.id);
  else visitState.bookmarks.add(a.id);
  saveSet(STORE_KEYS.bookmark, visitState.bookmarks);
  if (btn) btn.classList.toggle("on", visitState.bookmarks.has(a.id));
  renderLedger();
  if (state.bookmarkOnly) renderList(Date.now());
}

/* ---------------- 卡片 ---------------- */
/* 缩略图盒子恒定存在：有图放图，没图放「源色 + 来源字母」的占位块。
   两种情况下盒子尺寸完全一致，所以卡片高度不随配图有无跳动。 */
function thumbFor(a) {
  const hue = hueOf(a.source_id || a.source_name_en);
  const box = el("div", "thumb");
  box.style.setProperty("--src-hue", String(hue));
  if (!a.image_url) {
    box.classList.add("ph");
    box.appendChild(el("span", null, monogram(a.source_name_en)));
    return box;
  }
  const img = el("img");
  img.src = a.image_url;
  img.alt = "";
  img.loading = "lazy";
  img.referrerPolicy = "no-referrer";
  // 图挂了就地收起成占位（保留 <img> 节点本身）：列表里「有图 / 无图」两类卡片
  // 的数量仍与数据一致，不会因为一次网络失败就变样。
  img.addEventListener("error", () => {
    img.style.visibility = "hidden";
    box.classList.add("void");
    if (!box.querySelector(".void-mark")) box.appendChild(el("span", "void-mark", monogram(a.source_name_en)));
  });
  box.appendChild(img);
  return box;
}

function cardBadge(a) {
  if (a.cluster_id != null) {
    const n = membersOf(a.cluster_id, DATA).length;
    const b = button("badge cluster", `跨源 · ${n} 个来源`);
    b.title = "点击查看同一事件的全部来源报道";
    b.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      openCluster(a.cluster_id, `跨源事件 · ${n} 条同题报道`);
    });
    return b;
  }
  if (a.source_official) return el("span", "badge", "官方一手源");
  return null;
}

function cardFor(a, now) {
  const li = el("li", "card");
  li.dataset.id = a.id;
  if (isRead(a)) li.classList.add("read");
  if (a.cluster_id != null) li.classList.add("is-cluster");

  const top = el("div", "card-top");
  const src = el("span", "src");
  const swatch = el("i", "swatch");
  swatch.style.background = `hsl(${hueOf(a.source_id || a.source_name_en)} 42% 46%)`;
  src.appendChild(swatch);
  const nm = button("nm", a.source_name_en, `筛选来源：${a.source_name_en}`);
  nm.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); applySourceFilter(a.source_name_en); });
  src.appendChild(nm);
  top.appendChild(src);

  const right = el("span", "card-top-r");
  right.appendChild(el("span", "t", relTime(parseTime(a.published_at), now)));
  const bm = button("bookmark" + (isBookmarked(a) ? " on" : ""), null, isBookmarked(a) ? "取消收藏" : "加入收藏");
  bm.setAttribute("aria-pressed", String(isBookmarked(a)));
  bm.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg>';
  bm.addEventListener("click", (e) => {
    e.preventDefault();
    e.stopPropagation();
    toggleBookmark(a, bm);
    bm.setAttribute("aria-label", isBookmarked(a) ? "取消收藏" : "加入收藏");
    bm.setAttribute("aria-pressed", String(isBookmarked(a)));
  });
  right.appendChild(bm);
  top.appendChild(right);
  li.appendChild(top);

  const main = el("div", "card-main");
  const txt = el("div", "card-txt");
  const h3 = el("h3");
  const a1 = link(null, a.title || "(无标题)", a.url);
  a1.target = "_blank";
  a1.rel = "noopener noreferrer";
  a1.addEventListener("click", () => setRead(a, li));   // 点开即视为已读
  h3.appendChild(a1);
  txt.appendChild(h3);
  if (a.summary) txt.appendChild(el("p", null, a.summary));
  if (a.summary_source === "feed") txt.appendChild(el("span", "sum-src", "摘要：来源 feed 原文"));
  main.appendChild(txt);
  main.appendChild(thumbFor(a));
  li.appendChild(main);

  const foot = el("div", "card-foot");
  const leftFoot = el("span", "foot-l");
  const langBtn = button("lang", a.lang === "zh" ? "中" : "EN", a.lang === "zh" ? "筛选中文本源" : "筛选英文本源");
  langBtn.setAttribute("aria-pressed", String(state.filter === (a.lang === "zh" ? "zh" : "en")));
  langBtn.addEventListener("click", (e) => {
    e.preventDefault();
    e.stopPropagation();
    state.filter = a.lang === "zh" ? "zh" : "en";
    state.dup = true;
    renderAll(Date.now());
  });
  leftFoot.appendChild(langBtn);
  const badge = cardBadge(a);
  if (badge) leftFoot.appendChild(badge);   // 每张卡最多两个标记：语言 + 一个语义徽标
  foot.appendChild(leftFoot);

  const rightFoot = el("span", "r");
  if (a.heat != null) {
    // 热度只在真有量化口径的来源上出现（目前只有 Hacker News 的 points / 评论数），
    // 并且必须带来源前缀 —— 读者要能分辨「这数字是谁给的」。
    rightFoot.textContent = `HN ${a.heat} 分${a.comments != null ? ` · ${a.comments} 评论` : ""}`;
  }
  foot.appendChild(rightFoot);
  li.appendChild(foot);
  return li;
}

/* ---------------- 列表 ---------------- */
function renderSummary(shown) {
  const line = $("summaryLine");
  if (!line) return;
  const skipped = DATA.news.articles.filter((a) => hlIds.has(a.id) && passes(a, Date.now(), true)).length;
  clear(line);
  line.appendChild(el("span", null, `显示 ${shown} 条`));
  if (skipped) line.appendChild(el("b", null, ` · 已略过 ${skipped} 条（已在「今日重点」陈列）`));
  // 把「全站总数」和「其中多少条是重点」一起写出来：页签上的「全部 229」与报头的
  // 「共 234 条」不是矛盾，而是 234 = 229 + 5。数字关系摊开写，读者不必自己推理。
  line.appendChild(el("span", null,
    ` · 全站共 ${DATA.news.articles.length} 条（其中 ${hlIds.size} 条为重点）`));
}

function renderList(now) {
  const host = $("cards");
  if (!host) return;
  const list = sortArticles(DATA.news.articles.filter((a) => passes(a, now)));
  clear(host);
  const frag = document.createDocumentFragment();
  list.forEach((a) => frag.appendChild(cardFor(a, now)));
  host.appendChild(frag);

  const empty = $("empty");
  if (empty) {
    clear(empty);
    empty.hidden = list.length > 0;
    if (!list.length) {
      empty.appendChild(el("b", null, "没有符合条件的条目。"));
      const conds = activeConditions().map((c) => c.label).join(" / ");
      empty.appendChild(el("span", null, conds ? `当前条件：${conds}` : "当前没有任何筛选条件。"));
      const reset = button("chip", "清空全部条件");
      reset.addEventListener("click", clearAllFilters);
      empty.appendChild(reset);
    }
  }
  renderSummary(list.length);
}
/* ---------------- 信息源状态与运行记录（维护者视角，放在页面下方） ----------------
   顶栏只回答读者的三个问题；成功率、逐源状态、吞吐率这类指标属于维护者，
   放这里，不占首屏，也不冒充「内容」。 */
const STATUS_TEXT = {
  ok: "正常", no_new: "无新增", parse_warning: "解析告警", stale: "疑似停更", failed: "失败", skipped: "本次跳过",
};
const statusDot = (s) => (s === "failed" ? "bad" : s === "parse_warning" || s === "stale" ? "warn" : "ok");
const statusRank = (s) => ({ failed: 0, stale: 1, parse_warning: 2, no_new: 3, ok: 4 }[s] ?? 5);

function renderSources(data) {
  const host = $("srcBody");
  if (!host) return;
  clear(host);
  const status = data.status || {};
  const health = status.health || {};
  const counts = data.news.counts || {};
  const runById = new Map((status.sources || []).map((s) => [s.id, s]));
  const rows = (data.news.sources || []).map((s) => Object.assign({}, s, { run: runById.get(s.id) || {} }));
  rows.sort((a, b) => statusRank(a.run.status) - statusRank(b.run.status) ||
                      String(a.name_en).localeCompare(String(b.name_en)));

  const p = el("p", "panel-note");
  p.textContent =
    `本次运行：${health.ok || 0} 个信源正常、${health.no_new || 0} 个无新增、` +
    `${health.parse_warning || 0} 个解析告警、${health.stale || 0} 个疑似停更、${health.failed || 0} 个失败。` +
    (status.success_rate_7d != null ? `近 7 天成功率 ${(status.success_rate_7d * 100).toFixed(1)}%。` : "") +
    `带图条目 ${counts.with_image || 0} 条 / 共 ${counts.total || rows.length} 条（只取 feed 载荷里的图片地址，不会为配图去请求文章页）。`;
  host.appendChild(p);

  const table = el("table", "srctable");
  const thead = el("thead");
  const hrow = el("tr");
  ["来源", "语言", "本次状态", "抓取", "新增", "用时", "权重"].forEach((t) => hrow.appendChild(el("th", null, t)));
  thead.appendChild(hrow);
  table.appendChild(thead);
  const tbody = el("tbody");
  rows.forEach((s) => {
    const tr = el("tr");
    const c1 = el("td");
    const chip = button("chip", s.name_en);      // 表里的来源名一律用英文展示名
    chip.title = "点击只看该来源";
    chip.addEventListener("click", () => applySourceFilter(s.name_en));
    c1.appendChild(chip);
    if (s.official) c1.appendChild(el("span", "mini", "官方"));
    tr.appendChild(c1);
    tr.appendChild(el("td", "mono", s.lang === "zh" ? "中文" : "英文"));
    const c3 = el("td");
    c3.appendChild(el("span", "dot " + statusDot(s.run.status)));
    c3.appendChild(el("span", null, STATUS_TEXT[s.run.status] || "未记录"));
    tr.appendChild(c3);
    // 数字列要挂 .num，才会命中 td.num{text-align:right} —— 这段 CSS 之前一直是死代码
    tr.appendChild(el("td", "mono num", String(s.run.items_in ?? "—")));
    tr.appendChild(el("td", "mono num", String(s.run.items_new ?? "—")));
    tr.appendChild(el("td", "mono num", s.run.duration_ms != null ? `${(s.run.duration_ms / 1000).toFixed(1)}s` : "—"));
    tr.appendChild(el("td", "mono num", s.weight != null ? String(s.weight) : "—"));
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  host.appendChild(table);

  const runs = ((data.runs || {}).runs || []).slice(-6).reverse();
  if (runs.length) {
    const h4 = el("h4", "panel-h", "最近运行记录");
    host.appendChild(h4);
    const rt = el("table", "srctable");
    const rhead = el("thead");
    const hr = el("tr");
    ["运行时间（北京时间）", "触发", "新增", "去重", "入库总量", "耗时"].forEach((t) => hr.appendChild(el("th", null, t)));
    rhead.appendChild(hr);
    rt.appendChild(rhead);
    const rb = el("tbody");
    runs.forEach((r) => {
      const tr = el("tr");
      const at = parseTime(r.finished_at || r.run_at || r.generated_at || r.started_at);
      tr.appendChild(el("td", "mono", at != null ? fmtStamp(at) : "—"));
      tr.appendChild(el("td", "mono", r.trigger === "cron" ? "定时" : (r.trigger || "手动")));
      tr.appendChild(el("td", "mono num", String(r.total_new ?? "—")));
      tr.appendChild(el("td", "mono num", String(r.total_dup ?? "—")));
      tr.appendChild(el("td", "mono num", String(r.total_in_store ?? "—")));
      tr.appendChild(el("td", "mono num", r.duration_ms != null ? `${(r.duration_ms / 1000).toFixed(1)}s` : "—"));
      rb.appendChild(tr);
    });
    rt.appendChild(rb);
    host.appendChild(rt);
    const last = runs[0];
    if (last && last.duration_ms) {
      const rate = (Number(last.total_new) || 0) / (last.duration_ms / 60e3);
      host.appendChild(el("p", "panel-note",
        `吞吐率 ${rate.toFixed(1)} 条/分钟（本次新增 ÷ 本次耗时）。搬运量（本次抓到多少条）不是维护者该炫的指标，` +
        `这里只放它，方便判断定时任务有没有变慢。`));
    }
  }
}

/* ---------------- 导出：浏览器端生成文件，不经过任何服务器 ---------------- */
function download(name, text, type) {
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
function currentRows() { return sortArticles(DATA.news.articles.filter((a) => passes(a, Date.now()))); }
function exportJson() {
  const rows = currentRows();
  download(`ai-intel-${fmtStamp(parseTime(DATA.news.generated_at)).slice(0, 10)}.json`,
    JSON.stringify({ generated_at: DATA.news.generated_at, filter: state.filter, count: rows.length, articles: rows }, null, 2),
    "application/json");
}
function exportCsv() {
  const cols = ["id", "title", "source_name_en", "lang", "published_at", "score", "cluster_id", "url"];
  const esc = (v) => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
  const body = currentRows().map((a) => cols.map((k) => esc(a[k])).join(","));
  // 前置 BOM：Excel 直接打开中文才不乱码
  download(`ai-intel-${fmtStamp(parseTime(DATA.news.generated_at)).slice(0, 10)}.csv`,
    "\ufeff" + [cols.join(",")].concat(body).join("\r\n"),
    "text/csv;charset=utf-8");
}

/* ---------------- 事件绑定 ---------------- */
function rememberVisit() {
  // 读完上一次的值再写新的：这样「自上次来访新增」在真正回头访问时才算得出来。
  storeSet(STORE_KEYS.lastVisit, new Date().toISOString());
}

function bindEvents() {
  const q = $("q");
  if (q) q.addEventListener("input", () => { state.q = q.value.trim(); renderAll(Date.now()); });

  const dup = $("dupToggle");
  if (dup) dup.addEventListener("change", () => { state.dup = dup.checked; renderAll(Date.now()); });

  const sort = $("sort");
  if (sort) sort.addEventListener("change", () => { state.sort = sort.value; renderList(Date.now()); });

  const theme = $("themeToggle");
  if (theme) theme.addEventListener("click", toggleTheme);

  const reload = $("reloadBtn");
  if (reload) reload.addEventListener("click", () => window.location.reload());

  const backTop = $("backTop");
  if (backTop) backTop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));

  const close = $("modalClose");
  if (close) close.addEventListener("click", closeModal);
  const modal = $("modal");
  if (modal) modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeModal();
    if ((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === "k") {
      e.preventDefault();
      if (q) q.focus();
    }
  });

  const ej = $("exportJson");
  if (ej) ej.addEventListener("click", exportJson);
  const ec = $("exportCsv");
  if (ec) ec.addEventListener("click", exportCsv);
}

/* ---------------- 启动 ---------------- */
function renderAll(now) {
  renderHeader(DATA);
  renderHighlights(DATA, now);
  renderTabs();
  renderActiveFilters();
  renderLedger();
  renderRunLine();
  renderList(now);
}

function renderRunLine() {
  const host = $("runLine");
  if (!host) return;
  clear(host);
  const runs = ((DATA.runs || {}).runs || []);
  const last = runs[runs.length - 1];
  if (!last) { host.textContent = "运行记录缺失"; return; }
  const secs = last.duration_ms != null ? (last.duration_ms / 1000).toFixed(1) : "—";
  host.textContent = `最近一次运行 ${secs} 秒 · 新增 ${last.total_new ?? "—"} 条 · 去重 ${last.total_dup ?? "—"} 条 · 入库 ${last.total_in_store ?? "—"} 条`;
}

async function init() {
  const data = await loadData();
  if (!data || !data.news || !Array.isArray(data.news.articles)) {
    fail("情报数据未能载入", "内联数据为空，且 fetch data/*.json 也没拿到");
    return;
  }
  DATA = data;
  computeHlIds();
  loadVisitState(DATA.news);
  renderAll(Date.now());
  renderSources(DATA);
  renderFooter(DATA);
  bindEvents();
  rememberVisit();
  window.__APP_READY__ = true;   // 供无头校验脚本等待渲染完成
}

init();
</script>
</body>
</html>
