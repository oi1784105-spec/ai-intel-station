};
function sourceBlurb(a) { return SOURCE_BLURB[(a && a.source_id) || ""] || ""; }

/* ---------------- 本地存储：全部只写本机浏览器，不上传 ---------------- */
function storeGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
function storeSet(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* 隐私模式下静默降级为不记忆 */ } }
function readSet(key) {
  try {
    const raw = JSON.parse(storeGet(key) || "[]");
    return new Set(Array.isArray(raw) ? raw : []);
  } catch (e) { return new Set(); }
}
const saveSet = (key, set) => storeSet(key, JSON.stringify([...set]));

function loadVisitState(news) {
  visitState.read = readSet(STORE_KEYS.read);
  visitState.bookmarks = readSet(STORE_KEYS.bookmark);
  const stored = parseTime(storeGet(STORE_KEYS.lastVisit));
  visitState.lastVisit = stored;
  visitState.hasPrev = stored != null;
  // 「新增」口径 = 入库时间（first_seen_at）晚于上次来访，且你还没读过。
  // 用入库时间而不是发布时间：「上次来访之后才被我们收进来的」才算新增，
  // 与管线的时间戳语义一致。已读的排除在外，否则每次刷新都会被同一批条目再提醒一遍。
  visitState.newCount = stored == null ? 0
    : news.articles.filter((a) => {
        const t = parseTime(a.first_seen_at);
        return t != null && t > stored && !visitState.read.has(a.id);
      }).length;
}
const isRead = (a) => visitState.read.has(a.id);
const isBookmarked = (a) => visitState.bookmarks.has(a.id);

/* ---------------- 主题 ---------------- */
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  storeSet(STORE_KEYS.theme, theme);
}
function toggleTheme() {
  applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
}

/* ---------------- 数据装载与兜底 ---------------- */
async function loadData() {
  if (INLINE_DATA) return INLINE_DATA;
  const payload = {};
  for (const [key, path] of Object.entries(DATA_FILES)) {
    try {
      const res = await fetch(path, { cache: "no-store" });
      payload[key] = res.ok ? await res.json() : null;
    } catch (e) { payload[key] = null; }
  }
  return payload;
}

/* 走到这里说明数据真的没拿到。诚实报错，不渲染半页假内容。 */
function fail(title, detail) {
  const box = el("div", "err");
  box.appendChild(el("b", null, title));
  if (detail) box.appendChild(el("span", null, " —— " + detail));
  box.appendChild(el("div", null, "请先运行 python collect.py 生成 data/news.json，或直接用 dist/index.html（数据已内联）。"));
  const host = $("cards");
  clear(host);
  const li = el("li");
  li.appendChild(box);
  host.appendChild(li);
}
/* ---------------- 报头：只回答三个问题 ---------------- */
/* 顶栏不是运维大盘。读者只关心：整站可不可信、数据新不新、有多少条。
   成功率、来源健康分布、配图率这类维护者指标全部下移到页面下方的「信息源状态与运行记录」。 */
function overallStatus(status) {
  const h = (status && status.health) || {};
  const failed = h.failed || 0;
  const warn = (h.stale || 0) + (h.parse_warning || 0);
  if (!status) return { text: "整体状态：运行记录缺失", dot: "warn" };
  if (failed) return { text: `整体状态：${failed} 个信源本次抓取失败`, dot: "bad" };
  if (warn) return { text: `整体状态：${warn} 个信源需留意`, dot: "warn" };
  return { text: "整体状态：全部信源正常", dot: "ok" };
}

function renderHeader(data) {
  const news = data.news, status = data.status;
  const gen = parseTime(news.generated_at);

  const edition = $("edition");
  if (edition) edition.textContent = editionOf(gen);

  const health = $("health");
  if (health) {
    clear(health);
    const st = overallStatus(status);
    const pill1 = el("span", "pill");
    pill1.appendChild(el("span", "dot " + st.dot));
    pill1.appendChild(el("span", null, st.text));
    health.appendChild(pill1);                                   // ① 整站是否可信
    health.appendChild(el("span", "pill", `最后更新 ${fmtStamp(gen)}（北京时间）`));  // ② 数据新不新
    health.appendChild(el("span", "pill", `共 ${news.articles.length} 条`));          // ③ 有多少条
  }
  renderReadMeter(data);
}

/* 阅读进度是读者自己的账，不是全站指标，所以放在报头右侧而不是状态栏。 */
function renderReadMeter(data) {
  const host = $("readMeter");
  if (!host) return;
  const total = data.news.articles.length;
  const read = data.news.articles.filter(isRead).length;
  const pct = total ? Math.round((read / total) * 100) : 0;
  clear(host);
  host.appendChild(el("span", "rm-l", "已读"));
  host.appendChild(el("b", "rm-n", String(read)));
  host.appendChild(el("span", "rm-l", `/ ${total}`));
  const bar = el("span", "bar");
  bar.setAttribute("role", "img");
  bar.setAttribute("aria-label", `已读进度 ${pct}%`);
  const fill = el("i");
  fill.style.width = pct + "%";
  bar.appendChild(fill);
  host.appendChild(bar);
}

/* ---------------- 今日重点：主编特稿 + 侧栏（非对称版式） ---------------- */
/* meta.highlights 只给 article_id 与遴选理由，标题/配图要回 news.articles 里取。
   合并时「重点条目」的字段优先，缺失的（配图、摘要）再从文章补齐。 */
function metaHighlights(data) {
  const byId = new Map(data.news.articles.map((a) => [a.id, a]));
  return ((data.meta && data.meta.highlights) || []).map((h) => {
    const a = byId.get(h.article_id) || {};
    return Object.assign({}, a, h, {
      title: h.title || a.title,
      url: h.url || a.url,
      summary: h.summary || a.summary,
      image_url: h.image_url || a.image_url,
      published_at: h.published_at || a.published_at,
      source_name_en: h.source_name_en || a.source_name_en,
    });
  }).sort((a, b) => (Number(b.score) || 0) - (Number(a.score) || 0));
}

/* 遴选理由做成可点的窄标签：点了就按这条理由筛列表。
   注意标签文字必须与 reasons 里的原文逐字一致（后过滤靠它精确匹配），
   前面的 `#` 只由 CSS 的 ::before 生成，不进 textContent。 */
/* 「今日重点」的 reasons 是上游为读者改写过的一版（`命中多重信号：X、Y`、`N 个独立来源同时报道`），
   而条目数据里存的是规则名（`涉及X、Y`、`N 个独立来源报道`）。拿显示文字直接去筛会筛出 0 条 ——
   点不出结果的按钮比不可点更糟，所以显示与筛选都先归一到规则名，让「点的是什么」就是「筛的是什么」。 */
const REASON_ALIAS = [
  [/^命中多重信号[：:]\s*(.+)$/, "涉及$1"],
  [/^(\d+)\s*个独立来源同时报道$/, "$1 个独立来源报道"],
];
function reasonKey(reason) {
  const r = String(reason == null ? "" : reason).trim();
  for (const [re, rep] of REASON_ALIAS) if (re.test(r)) return r.replace(re, rep);
  return r;
}
let _reasonKeys = null;
function allReasonKeys() {
  if (!_reasonKeys) {
    _reasonKeys = new Set();
    DATA.news.articles.forEach((a) => (a.reasons || []).forEach((r) => _reasonKeys.add(reasonKey(r))));
  }
  return _reasonKeys;
}

function reasonChips(item) {
  const reasons = [...new Set((item.reasons || []).map(reasonKey))];
  const clusterish = (r) => /独立来源/.test(r);
  // 跨源理由排在最前：它是「这一条为什么值得读」里信息量最大的一句
  reasons.sort((a, b) => (clusterish(b) ? 1 : 0) - (clusterish(a) ? 1 : 0));
  return reasons.map((reason) => {
    const chip = button("why", reason);
    if (!allReasonKeys().has(reason)) {
      // 这类理由在条目数据里查不到同名字段：不做成按钮，只当说明陈列（并写明为什么不可点）
      chip.disabled = true;
      chip.title = `「${reason}」在条目数据里没有同名字段，不作筛选入口`;
      return chip;
    }
    chip.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      applyReasonFilter(reason);
    });
    return chip;
  });
}

function applyReasonFilter(reason) {
  const key = reasonKey(reason);
  if (/独立来源/.test(key)) {
    const hit = metaHighlights(DATA).find((h) => (h.reasons || []).map(reasonKey).includes(key));
    // 查不到对应重点条目时退回「按理由筛」，不许留下点不出结果的空筛选
    state.cluster = hit ? hit.cluster_id : null;
    state.clusterLabel = key;
    state.why = hit ? null : key;
  } else {
    state.why = key;
    state.cluster = null;
  }
  // 从重点区点进来，必然要看那条被默认略过的重点条目：自动打开「列表含重点条目」
  state.dup = true;
  renderAll(Date.now());
  const section = $("listSection");
  if (section && section.scrollIntoView) section.scrollIntoView({ behavior: "smooth", block: "start" });
}

function leadMeta(item, index, now) {
  const row = el("div", "lead-meta");
  row.appendChild(el("span", "no", `NO.${p2(index + 1)}`));
  row.appendChild(el("span", "pts", (Number(item.score) || 0).toFixed(2)));
  row.appendChild(el("span", "sep", "·"));
  const src = button("hl-src", item.source_name_en, `来源：${item.source_name_en}`);
  src.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); applySourceFilter(item.source_name_en); });
  row.appendChild(src);
  row.appendChild(el("span", "t", `· ${relTime(parseTime(item.published_at), now)}`));
  const others = Number(item.independent_sources || 0);
  if (others > 1) row.appendChild(el("span", "xref", `${others} 个独立来源`));
  else if (item.cluster_id != null) row.appendChild(el("span", "xref", "多来源交叉"));
  return row;
}

/* 特稿为什么是特稿？多数时候因为「多家来源在同一天报了同一件事」。
   那就把另外几家当场列出来：同行标题、各自来源、各自时间（全是 feed 里的真数据），
   点击进原文。这一段同时回答两个问题：凭什么它是头条、以及我能自己去核对。 */
function leadCross(item) {
  if (item.cluster_id == null) return null;
  const others = membersOf(item.cluster_id, DATA).filter((a) => a.id !== item.id);
  if (!others.length) return null;
  const box = el("div", "lead-cross");
  box.appendChild(el("div", "lead-cross-h", `同一事件的其他来源报道（${others.length} 家）`));
  const list = el("ul", "lead-cross-list");
  others.forEach((a) => {
    const li = el("li");
    li.appendChild(el("span", "src", a.source_name_en));
    const t = link("cross-title", a.title || "(无标题)", a.url);
    t.target = "_blank";
    t.rel = "noopener noreferrer";
    t.addEventListener("click", () => setRead(a, null));
    li.appendChild(t);
    li.appendChild(el("span", "t", relTime(parseTime(a.published_at), Date.now())));
    list.appendChild(li);
  });
  box.appendChild(list);
  return box;
}

function leadHero(item, now) {
  const hero = el("article", "lead-hero hl");
  hero.appendChild(leadMeta(item, 0, now));
  const h = el("h3");
  h.appendChild(link(null, item.title || "(无标题)", item.url));
  hero.appendChild(h);
  if (item.summary) {
    hero.appendChild(el("p", "lead-sum", item.summary));
  } else if (sourceBlurb(item)) {
    hero.appendChild(el("span", "sum-src", "来源简介：" + sourceBlurb(item)));
  }
  hero.appendChild(leadFigure(item));
  const cross = leadCross(item);
  if (cross) hero.appendChild(cross);
  const foot = el("div", "lead-foot");
  const tags = el("span", "tags");
  reasonChips(item).forEach((c) => tags.appendChild(c));
  foot.appendChild(tags);
  foot.appendChild(link("dispatch", "读原文 →", item.url));
  hero.appendChild(foot);
  return hero;
}

/* 配图只从 feed 载荷里已有的字段取，永不为了配图再去请求文章页 —— 
   首页 234 条若逐条抓 og:image 就是 234 次外部请求，静态站不该有这种隐式代价。 */
function leadFigure(item) {
  if (!item.image_url) return el("span", "lead-noimg", "本条无配图（来源 feed 未提供图片地址）");
  const fig = el("figure", "lead-fig");
  const img = el("img");
  img.src = item.image_url;
  img.alt = "";
  img.loading = "lazy";
  img.referrerPolicy = "no-referrer";
  // 图片失效时整块收起，不留破图标：展示一张错图比不展示更糟
  img.addEventListener("error", () => { fig.remove(); });
  fig.appendChild(img);
  fig.appendChild(el("figcaption", null, "配图取自来源 feed 载荷，未额外请求文章页"));
  return fig;
}

function leadSideItem(item, index, now, compact) {
  const box = el("article", "lead-item hl" + (compact ? " compact" : ""));
  box.appendChild(leadMeta(item, index, now));
  const h = el(compact ? "h5" : "h4");
  h.appendChild(link(null, item.title || "(无标题)", item.url));
  box.appendChild(h);
  if (item.summary) {
    box.appendChild(el("p", "lead-sum", item.summary));
  } else if (sourceBlurb(item)) {
    box.appendChild(el("span", "sum-src", "来源简介：" + sourceBlurb(item)));
  }
  const foot = el("div", "lead-foot");
  const tags = el("span", "tags");
  reasonChips(item).slice(0, compact ? 1 : 2).forEach((c) => tags.appendChild(c));
  foot.appendChild(tags);
  if (!compact && item.image_url) {
    const thumb = el("span", "lead-thumb");
    const img = el("img");
    img.src = item.image_url; img.alt = ""; img.loading = "lazy"; img.referrerPolicy = "no-referrer";
    img.addEventListener("error", () => { thumb.remove(); });
    thumb.appendChild(img);
    foot.appendChild(thumb);
  }
  box.appendChild(foot);
  return box;
}

function renderHighlights(data, now) {
  const host = $("highlights");
  if (!host) return;
  const items = metaHighlights(data);
  clear(host);
  if (!items.length) {
    host.appendChild(el("p", "hl-empty", "本次运行没有产出「今日重点」条目。"));
    return;
  }
  const minScore = Math.min(...items.map((h) => Number(h.score) || 0));
  const sub = $("hlSub");
  if (sub) sub.textContent = `综合评分 ≥ ${minScore.toFixed(2)} 的高权重事件 · 头条取其中配图可用且分数最高的一条 · 评分由本地规则计算，非模型生成`;
  const count = $("hlCount");
  if (count) count.textContent = `LEAD STORIES / ${items.length} SELECTED`;

  // 头条必须有配图：items 已按分数降序排好，取「有配图」中分数最高的一条当头条；
  // 只有当重点条目全都没有配图时，才退回分数最高者（此时特稿会如实标注本条无配图）。
  const leadAt = items.findIndex((it) => it.image_url);
  const heroAt = leadAt >= 0 ? leadAt : 0;
  host.appendChild(leadHero(items[heroAt], now));
  const rest = items.filter((_, i) => i !== heroAt);
  const side = el("div", "lead-side");
  rest.slice(0, 2).forEach((item, i) => side.appendChild(leadSideItem(item, i + 1, now, false)));
  const tail = rest.slice(2);
  if (tail.length) {
    const mini = el("div", "lead-mini");
    tail.forEach((item, i) => mini.appendChild(leadSideItem(item, i + 3, now, true)));
    side.appendChild(mini);
  }
  host.appendChild(side);
  syncHlCarousel();   // 窄屏轮播的屏数与指示点，跟着「今日重点」的条目一起重建
}

/* ---------------- 窄屏「今日重点」横向轮播 ----------------
   窄屏（<1024px）下 .lead-grid 是一条横向吸附轨道，每张重点卡（.hl）自己是一屏。
   · 滑动交给原生滚动 + scroll-snap：手指拖动是浏览器自己的行为，不会和卡片上的点击抢事件；
     自动播放、左右箭头、分页指示器都只做同一件事 ——「滚到第 k 屏」，
     左右滑动的动画由 CSS 的 scroll-behavior:smooth 给（不是突然闪切）；
   · 桌面（≥1024px）整段不生效：matchMedia 为 false 时连 DOM 都不改，桌面渲染逐字节不变。
   诚实性底线：箭头与每一颗指示点都是真按钮，点哪一屏就滚到哪一屏，这里没有摆设控件。 */
const HL_MQ = "(max-width:1023px)";
const HL_EVERY = 6000;    // 每屏停留多久
const HL_RESUME = 8000;   // 手动划走之后，隔这么久再恢复自动轮播
const HL_REDUCE = window.matchMedia
  ? window.matchMedia("(prefers-reduced-motion: reduce)") : null;   // 只是「少一点动」，不是「不轮播」
/* 状态挂到 window 供无头校验读取（不参与渲染）。tools/verify_ui.py 的窄屏段靠它断言
   「箭头/指示点真的滚到了那一屏」「自动播放真的在推进」，不然这些只能靠肉眼。 */
const HL_STATE = {
  n: 0, idx: 0, target: 0, playing: false, hold: false, paused: false,
  inView: true, reduce: false, smooth: false,
};
window.__HL__ = HL_STATE;

function hlSlides() {
  const track = $("highlights");
  return track ? Array.from(track.querySelectorAll(".hl")) : [];
}
function hlAt() {   // 离左缘最近的那一屏就是当前屏（滚到哪里都不会算错）
  const track = $("highlights"), slides = hlSlides();
  if (!track || !slides.length) return 0;
  const base = track.getBoundingClientRect().left;
  let best = 0, dist = Infinity;
  slides.forEach((s, i) => {
    const d = Math.abs(s.getBoundingClientRect().left - base);
    if (d < dist) { dist = d; best = i; }
  });
  return best;
}
function hlPaint(idx) {
  HL_STATE.idx = idx;
  const dots = $("hlDots");
  if (!dots) return;
  Array.from(dots.children).forEach((b, i) => {
    b.setAttribute("aria-current", i === idx ? "true" : "false");
  });
}
function hlGoTo(i, byUser) {
  const track = $("highlights"), slides = hlSlides();
  if (!track || !slides.length) return;
  const n = slides.length;
  const next = ((i % n) + n) % n;   // 首尾相接：最后一条的「下一条」回到第一条，反之亦然
  const box = track.getBoundingClientRect();
  // 用两屏的左缘差算滚动目标：间距、内距怎么变都不会差一屏
  const left = slides[next].getBoundingClientRect().left - box.left + track.scrollLeft;
  const reduce = !!(HL_REDUCE && HL_REDUCE.matches);
  HL_STATE.reduce = reduce;
  HL_STATE.smooth = !reduce;                       // 关了动效就一跳到位，不做滑动动画
  track.scrollTo({ left, behavior: reduce ? "auto" : "smooth" });
  HL_STATE.target = next;
  hlPaint(next);
  if (byUser) hlResumeSoon(HL_RESUME);   // 手动切完继续自动轮播，只是先歇一会
}
function hlTick() {
  if (!HL_STATE.playing || HL_STATE.hold || HL_STATE.inView === false || document.hidden) return;
  hlGoTo(HL_STATE.target + 1, false);
}
function hlStart() {
  if (HL_STATE.playing || HL_STATE.paused) return;   // 「暂停」是用户按下的，得等他按回来
  HL_STATE.playing = true;
  HL_STATE.timer = setInterval(hlTick, HL_EVERY);
}
function hlStop() {
  HL_STATE.playing = false;
  clearInterval(HL_STATE.timer);
}
/* 暂停/播放：真按钮，按一下就真停、再按一下就真走（WCAG 2.2.2 要求的暂停机制）。
   动效减弱只影响「滑不滑动」，不影响「能不能轮播」，所以这里不掺 prefers-reduced-motion。 */
function hlTogglePlay() {
  HL_STATE.paused = !HL_STATE.paused;
  const btn = $("hlToggle");
  if (btn) {
    btn.setAttribute("aria-pressed", HL_STATE.paused ? "true" : "false");
    btn.textContent = HL_STATE.paused ? "播放" : "暂停";
  }
  if (HL_STATE.paused) hlStop();
  else { HL_STATE.hold = false; hlStart(); }
}
function hlHoldNow() { HL_STATE.hold = true; }
function hlResumeSoon(delay) {
  clearTimeout(HL_STATE.resume);
  HL_STATE.resume = setTimeout(() => { HL_STATE.hold = false; }, delay || 0);
}
function hlBar() {   // 控制条插在轨道后面（轨道重建时它留在原地，只重建指示点）
  const track = $("highlights");
  if (!track || !track.parentNode) return null;
  let bar = $("hlBar");
  if (!bar) {
    bar = el("div", "hl-bar");
    bar.id = "hlBar";
    bar.setAttribute("role", "group");
    bar.setAttribute("aria-label", "今日重点轮播控制");
    const prev = button("hl-arrow", "←", "上一条重点");
    const next = button("hl-arrow", "→", "下一条重点");
    prev.id = "hlPrev";
    next.id = "hlNext";
    const dots = el("div", "hl-dots");
    dots.id = "hlDots";
    const toggle = button("hl-toggle", "暂停", "暂停或继续自动轮播");
    toggle.id = "hlToggle";
    toggle.setAttribute("aria-pressed", "false");
    prev.addEventListener("click", () => hlGoTo(HL_STATE.target - 1, true));
    next.addEventListener("click", () => hlGoTo(HL_STATE.target + 1, true));
    toggle.addEventListener("click", hlTogglePlay);
    bar.appendChild(prev);
    bar.appendChild(dots);
    bar.appendChild(next);
    bar.appendChild(toggle);
    // 手指/鼠标停在控制条上、或键盘焦点在里面时不要滑走 —— 读者正在操作（WCAG 2.2.2）
    bar.addEventListener("pointerenter", hlHoldNow);
    bar.addEventListener("focusin", hlHoldNow);
    bar.addEventListener("pointerleave", () => hlResumeSoon(2000));
    bar.addEventListener("focusout", () => hlResumeSoon(2000));
    track.parentNode.insertBefore(bar, track.nextSibling);
  }
  const dots = $("hlDots");
  clear(dots);
  hlSlides().forEach((s, i) => {
    const head = s.querySelector("h3, h4, h5");
    const dot = button("hl-dot", null, `第 ${i + 1} 条重点：${(head && head.textContent) || ""}`);
    dot.appendChild(el("span"));
    dot.addEventListener("click", () => hlGoTo(i, true));
    dots.appendChild(dot);
  });
  return bar;
}
function syncHlCarousel() {
  const track = $("highlights");
  if (!track) return;
  if (!hlBar()) return;
  HL_STATE.n = hlSlides().length;
  if (!(window.matchMedia && window.matchMedia(HL_MQ).matches)) {   // 桌面：不碰 DOM、停表
    hlStop();
    HL_STATE.hold = false;
    HL_STATE.target = 0;
    hlPaint(0);
    return;
  }
  if (track.dataset.hlBound !== "1") {
    track.dataset.hlBound = "1";
    track.addEventListener("scroll", () => hlPaint(hlAt()), { passive: true });
    // 手指按住/正在拖动的那一下不要被自动播放打断
    track.addEventListener("pointerdown", hlHoldNow);
    track.addEventListener("touchstart", hlHoldNow, { passive: true });
    ["pointerup", "pointercancel", "touchend", "touchcancel"].forEach((ev) =>
      track.addEventListener(ev, () => hlResumeSoon(HL_RESUME), { passive: true }));
    track.addEventListener("pointerenter", hlHoldNow);
    track.addEventListener("pointerleave", () => hlResumeSoon(2000));
    track.addEventListener("keydown", (e) => {   // 焦点在轨道上时左右键翻页
      if (e.key === "ArrowLeft") { e.preventDefault(); hlGoTo(HL_STATE.target - 1, true); }
      if (e.key === "ArrowRight") { e.preventDefault(); hlGoTo(HL_STATE.target + 1, true); }
    });
    if (window.IntersectionObserver) {
      new IntersectionObserver((entries) => {
        entries.forEach((en) => {
          HL_STATE.inView = en.isIntersecting && en.intersectionRatio > 0.2;
        });
      }, { threshold: [0, 0.2, 0.5] }).observe(track);   // 滚出屏幕就停表，不在看不见的地方空转
    }
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) hlHoldNow(); else hlResumeSoon(600);
    });
  }
  track.scrollLeft = 0;
  HL_STATE.target = 0;
  hlPaint(0);
  hlStart();
}
if (window.matchMedia) {   // 视口跨过 1024px：桌面停表复位，窄屏重建指示点并开始轮播
  const hlMq = window.matchMedia(HL_MQ);
  const hlOnMq = () => syncHlCarousel();
  if (hlMq.addEventListener) hlMq.addEventListener("change", hlOnMq);
  else if (hlMq.addListener) hlMq.addListener(hlOnMq);
}
let hlResizeTimer = null;
window.addEventListener("resize", () => {   // 同档内改宽度（横竖屏）：按当前屏重新对齐
  clearTimeout(hlResizeTimer);
  hlResizeTimer = setTimeout(() => {
    if (window.matchMedia && window.matchMedia(HL_MQ).matches) hlGoTo(HL_STATE.target, false);
  }, 200);
});

/* ---------------- 跨源浮层：把「同一件事的多家报道」逐条摊开 ---------------- */
function membersOf(clusterId, data) {
  return data.news.articles
    .filter((a) => a.cluster_id === clusterId)
    .sort((a, b) => (parseTime(b.published_at) || 0) - (parseTime(a.published_at) || 0));
}

function openCluster(clusterId, label) {
  const data = DATA;
  if (!data || clusterId == null) return;
  const members = membersOf(clusterId, data);
  if (!members.length) return;
  const modal = $("modal");
  if (!modal) return;
  const title = $("modalTitle");
  if (title) title.textContent = label || `跨源事件 · ${members.length} 条同题报道`;
  const body = $("modalBody");
  clear(body);
  members.forEach((a, i) => {
    const row = el("div", "modal-item");
    row.appendChild(el("span", "mi-no", p2(i + 1)));
    row.appendChild(el("span", "mi-src", a.source_name_en));       // 每行一个来源，可逐条核对
    row.appendChild(link("mi-title", a.title || "(无标题)", a.url));
    row.appendChild(el("span", "mi-time", relTime(parseTime(a.published_at), Date.now())));
    body.appendChild(row);
  });
  const note = $("modalNote");
  if (note) note.textContent =
    `同一事件的不同来源报道逐条列出（按发布时间倒序），共 ${members.length} 条。` +
    `相似度阈值与判据由本地规则给出，未调用任何外部接口。`;
  modal.hidden = false;
  document.body.classList.add("modal-open");
}

function closeModal() {
  const modal = $("modal");
  if (modal) modal.hidden = true;
  document.body.classList.remove("modal-open");
}

function applySourceFilter(name) {
  state.src = name;
  state.dup = true;   // 重点区里的条目默认不在列表里，筛来源时要让人看得到
  renderAll(Date.now());
}
/* ---------------- 筛选与排序 ---------------- */
/* 窗口类判据以 generated_at 为基准（而不是浏览器此刻）：这样「今天」页签的
   数字与列表条数在任何时候打开都稳定，不会因为隔天再打开就自己变少。 */
function windowBase() {
  const ms = parseTime(DATA && DATA.news && DATA.news.generated_at);
  return ms == null ? Date.now() : ms;
}
function inWindow(a, hours) {
  const t = parseTime(a.published_at);
  return t != null && windowBase() - t <= hours * HOUR;
}
const FILTER_PREDICATES = {
  all: () => true,
  zh: (a) => a.lang === "zh",
  en: (a) => a.lang === "en",
  official: (a) => !!a.source_official,
  cluster: (a) => a.cluster_id != null,
  today: (a) => inWindow(a, 24),
  week: (a) => inWindow(a, 168),
};

let hlIds = new Set();
function computeHlIds() {
  hlIds = new Set((((DATA.meta || {}).highlights) || []).map((h) => h.article_id));
}

function passes(a, now, ignoreDup) {
  if (!FILTER_PREDICATES[state.filter](a)) return false;
  if (state.src && a.source_name_en !== state.src) return false;
  if (state.cluster != null && a.cluster_id !== state.cluster) return false;
  if (state.why && !(a.reasons || []).includes(state.why)) return false;
  if (state.unreadOnly && isRead(a)) return false;
  if (state.bookmarkOnly && !isBookmarked(a)) return false;
  if (state.q) {
    const hay = `${a.title || ""} ${a.summary || ""} ${a.source_name_en || ""}`.toLowerCase();
    if (!hay.includes(state.q.toLowerCase())) return false;
  }
  // 默认把「今日重点」从列表里剔掉：同一件事不该在首屏出现两遍。
  // 想看时勾「列表含重点条目」，两张清单口径都写在条数行里，不让人猜。
  if (!ignoreDup && !state.dup && hlIds.has(a.id)) return false;
  return true;
}

function sortArticles(list) {
  const out = list.slice();
  const byTime = (a, b) => (parseTime(b.published_at) || 0) - (parseTime(a.published_at) || 0);
  const byScore = (a, b) => (Number(b.score) || 0) - (Number(a.score) || 0) || byTime(a, b);
  if (state.sort === "time") out.sort(byTime);
  else if (state.sort === "heat") out.sort((a, b) => (Number(b.heat) || 0) - (Number(a.heat) || 0) || byScore(a, b));
  else out.sort(byScore);
  return out;
}

/* ---------------- 分类页签 ---------------- */
/* 页签上的数字 = 点进去真能看到的条数（套用「重点条目是否重复显示」的口径）。 */
function filterCount(key) {
  return DATA.news.articles.filter((a) => {
    if (!FILTER_PREDICATES[key](a)) return false;
    return state.dup || !hlIds.has(a.id);
  }).length;
}

function renderTabs() {
  const host = $("filters");
  if (!host) return;
  clear(host);
  FILTERS.forEach((f) => {
    const chip = button("chip tab");
    chip.appendChild(el("span", "ct", f.text));
    chip.appendChild(el("span", "n", String(filterCount(f.key))));
    chip.setAttribute("aria-pressed", String(state.filter === f.key));
    chip.addEventListener("click", () => { state.filter = f.key; renderAll(Date.now()); });
    host.appendChild(chip);
  });
}

/* ---------------- 筛选条件指示条：所有收窄条件都可逐个摘掉 ---------------- */
function activeConditions() {
  const list = [];
  const f = FILTERS.find((x) => x.key === state.filter);
  if (state.filter !== "all" && f) list.push({ label: f.text, clear: () => { state.filter = "all"; } });
  if (state.src) list.push({ label: `来源：${state.src}`, clear: () => { state.src = null; } });
  if (state.cluster != null) {
    list.push({
      label: `跨源事件：${state.clusterLabel || "#" + state.cluster}`,
      clear: () => { state.cluster = null; state.clusterLabel = null; },
    });
  }
  if (state.why) list.push({ label: state.why, clear: () => { state.why = null; } });
  if (state.q) list.push({ label: `检索：${state.q}`, clear: () => { state.q = ""; const q = $("q"); if (q) q.value = ""; } });
  if (state.unreadOnly) list.push({ label: "只看未读", clear: () => { state.unreadOnly = false; } });
  if (state.bookmarkOnly) list.push({ label: "只看收藏", clear: () => { state.bookmarkOnly = false; } });
  if (state.dup) list.push({ label: "列表含重点条目", clear: () => { state.dup = false; } });
  return list;
}

function renderActiveFilters() {
  const host = $("activeFilters");
  if (!host) return;
  const conds = activeConditions();
  clear(host);
  if (!conds.length) { host.hidden = true; return; }   // 无条件时整行收起，不留空条
  host.hidden = false;
  host.appendChild(el("span", "af-label", "筛选中："));
  conds.forEach((c) => {
    const token = el("span", "af-token");
    token.appendChild(el("span", null, c.label));
    const x = button("af-x", "×", `移除条件：${c.label}`);
    x.addEventListener("click", () => { c.clear(); renderAll(Date.now()); });
    token.appendChild(x);
    host.appendChild(token);
  });
  const all = button("af-clear", "清空全部条件");
  all.addEventListener("click", clearAllFilters);
  host.appendChild(all);
}

function clearAllFilters() {
  state.filter = "all";
  state.q = "";
  state.src = null;
  state.why = null;
  state.cluster = null;
  state.clusterLabel = null;
  state.unreadOnly = false;
  state.bookmarkOnly = false;
  state.dup = false;
  const q = $("q"); if (q) q.value = "";
  const dup = $("dupToggle"); if (dup) dup.checked = false;
  renderAll(Date.now());
}

/* ---------------- 阅读账本（首访也显示） ----------------
   这一行是「功能可发现」的入口：藏起来就等于「只看未读 / 已读变淡」永远没人知道。
   首访说明这是第一次来，不显示「新增 0 篇」这种既没信息量又像出错的措辞。 */
function renderLedger() {
  const bar = $("visitBar");
  if (!bar) return;
  const articles = DATA.news.articles;
  const total = articles.length;
  const read = articles.filter(isRead).length;
  const bm = articles.filter(isBookmarked).length;
  clear(bar);
  const left = el("span", "led");
  if (visitState.hasPrev) {
    left.appendChild(el("span", null, "自上次来访"));
    left.appendChild(el("b", null, `新增 ${visitState.newCount} 篇未读`));
    left.appendChild(el("span", null, ` · 全站未读 ${total - read} 条`));
  } else {
    left.appendChild(el("span", null, `首次访问 · 全部 ${total} 条均为未读`));
  }
  left.appendChild(el("span", null, ` · 已读 ${read} 条 · 收藏 ${bm} 条（只记录在本机浏览器）`));
  bar.appendChild(left);

  const acts = el("span", "acts");
  const unreadBtn = button("chip", "只看未读");
  unreadBtn.setAttribute("aria-pressed", String(state.unreadOnly));
  unreadBtn.addEventListener("click", () => { state.unreadOnly = !state.unreadOnly; renderAll(Date.now()); });
  const bmBtn = button("chip", "只看收藏");
  bmBtn.setAttribute("aria-pressed", String(state.bookmarkOnly));
  bmBtn.addEventListener("click", () => { state.bookmarkOnly = !state.bookmarkOnly; renderAll(Date.now()); });
  const allBtn = button("chip", "全部标为已读");
  allBtn.addEventListener("click", markAllRead);
  acts.append(unreadBtn, bmBtn, allBtn);
  bar.appendChild(acts);
}

/* 已读标记是「就地改一个类」，不走整表重绘 —— 重绘会把读者点的那张卡片换掉，
   滚动位置和焦点都会跳。 */
function setRead(a, cardEl) {
  if (!visitState.read.has(a.id)) {
    visitState.read.add(a.id);
    saveSet(STORE_KEYS.read, visitState.read);
  }
  if (cardEl) cardEl.classList.add("read");
  renderLedger();
  renderReadMeter(DATA);
}

function markAllRead() {
  DATA.news.articles.forEach((a) => visitState.read.add(a.id));
  saveSet(STORE_KEYS.read, visitState.read);
  renderAll(Date.now());
}

function toggleBookmark(a, btn) {
  if (visitState.bookmarks.has(a.id)) visitState.bookmarks.delete(a.id);
  else visitState.bookmarks.add(a.id);
  saveSet(STORE_KEYS.bookmark, visitState.bookmarks);
  if (btn) btn.classList.toggle("on", visitState.bookmarks.has(a.id));
  renderLedger();
  if (state.bookmarkOnly) renderList(Date.now());
}

/* ---------------- 卡片 ---------------- */
/* 缩略图盒子恒定存在：有图放图，没图放「源色 + 来源字母」的占位块。
   两种情况下盒子尺寸完全一致，所以卡片高度不随配图有无跳动。 */
function thumbFor(a) {
  const hue = hueOf(a.source_id || a.source_name_en);
  const box = el("div", "thumb");
  box.style.setProperty("--src-hue", String(hue));
  if (!a.image_url) {
    box.classList.add("ph");
    box.appendChild(el("span", null, monogram(a.source_name_en)));
    return box;
  }
  const img = el("img");
  img.src = a.image_url;
  img.alt = "";
  img.loading = "lazy";
  img.referrerPolicy = "no-referrer";
  // 图挂了就地收起成占位（保留 <img> 节点本身）：列表里「有图 / 无图」两类卡片
  // 的数量仍与数据一致，不会因为一次网络失败就变样。
  img.addEventListener("error", () => {
    img.style.visibility = "hidden";
    box.classList.add("void");
    if (!box.querySelector(".void-mark")) box.appendChild(el("span", "void-mark", monogram(a.source_name_en)));
  });
  box.appendChild(img);
  return box;
}

function cardBadge(a) {
  if (a.cluster_id != null) {
    const n = membersOf(a.cluster_id, DATA).length;
    const b = button("badge cluster", `跨源 · ${n} 个来源`);
    b.title = "点击查看同一事件的全部来源报道";
    b.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      openCluster(a.cluster_id, `跨源事件 · ${n} 条同题报道`);
    });
    return b;
  }
  if (a.source_official) return el("span", "badge", "官方一手源");
  return null;
}

function cardFor(a, now) {
  const li = el("li", "card");
  li.dataset.id = a.id;
  if (isRead(a)) li.classList.add("read");
  if (a.cluster_id != null) li.classList.add("is-cluster");

  const top = el("div", "card-top");
  const src = el("span", "src");
  const swatch = el("i", "swatch");
  swatch.style.background = `hsl(${hueOf(a.source_id || a.source_name_en)} 42% 46%)`;
  src.appendChild(swatch);
  const nm = button("nm", a.source_name_en, `筛选来源：${a.source_name_en}`);
  nm.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); applySourceFilter(a.source_name_en); });
  src.appendChild(nm);
  top.appendChild(src);

  const right = el("span", "card-top-r");
  right.appendChild(el("span", "t", relTime(parseTime(a.published_at), now)));
  const bm = button("bookmark" + (isBookmarked(a) ? " on" : ""), null, isBookmarked(a) ? "取消收藏" : "加入收藏");
  bm.setAttribute("aria-pressed", String(isBookmarked(a)));
  bm.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg>';
  bm.addEventListener("click", (e) => {
    e.preventDefault();
    e.stopPropagation();
    toggleBookmark(a, bm);
    bm.setAttribute("aria-label", isBookmarked(a) ? "取消收藏" : "加入收藏");
    bm.setAttribute("aria-pressed", String(isBookmarked(a)));
  });
  right.appendChild(bm);
  top.appendChild(right);
  li.appendChild(top);

  const main = el("div", "card-main");
  const txt = el("div", "card-txt");
  const h3 = el("h3");
  const a1 = link(null, a.title || "(无标题)", a.url);
  a1.target = "_blank";
  a1.rel = "noopener noreferrer";
  a1.addEventListener("click", () => setRead(a, li));   // 点开即视为已读
  h3.appendChild(a1);
  txt.appendChild(h3);
  if (a.summary) {
    txt.appendChild(el("p", null, a.summary));
    if (a.summary_source === "feed") txt.appendChild(el("span", "sum-src", "摘要：来源 feed 原文"));
  } else {
    // 源站 feed 未给摘要：退到「来源简介」，并把话说清楚是来源说明而不是文章摘要
    const b = sourceBlurb(a);
    if (b) txt.appendChild(el("span", "sum-src", "来源简介：" + b));
  }
  main.appendChild(txt);
  main.appendChild(thumbFor(a));
  li.appendChild(main);

  const foot = el("div", "card-foot");
  const leftFoot = el("span", "foot-l");
  const langBtn = button("lang", a.lang === "zh" ? "中" : "EN", a.lang === "zh" ? "筛选中文本源" : "筛选英文本源");
  langBtn.setAttribute("aria-pressed", String(state.filter === (a.lang === "zh" ? "zh" : "en")));
  langBtn.addEventListener("click", (e) => {
    e.preventDefault();
    e.stopPropagation();
    state.filter = a.lang === "zh" ? "zh" : "en";
    state.dup = true;
    renderAll(Date.now());
  });
  leftFoot.appendChild(langBtn);
  const badge = cardBadge(a);
  if (badge) leftFoot.appendChild(badge);   // 每张卡最多两个标记：语言 + 一个语义徽标
  foot.appendChild(leftFoot);

  const rightFoot = el("span", "r");
  if (a.heat != null) {
    // 热度只在真有量化口径的来源上出现（目前只有 Hacker News 的 points / 评论数），
    // 并且必须带来源前缀 —— 读者要能分辨「这数字是谁给的」。
    rightFoot.textContent = `HN ${a.heat} 分${a.comments != null ? ` · ${a.comments} 评论` : ""}`;
  }
  foot.appendChild(rightFoot);
  li.appendChild(foot);
  return li;
}

/* ---------------- 列表 ---------------- */
function renderSummary(shown) {
  const line = $("summaryLine");
  if (!line) return;
  const skipped = DATA.news.articles.filter((a) => hlIds.has(a.id) && passes(a, Date.now(), true)).length;
  clear(line);
  line.appendChild(el("span", null, `显示 ${shown} 条`));
  if (skipped) line.appendChild(el("b", null, ` · 已略过 ${skipped} 条（已在「今日重点」陈列）`));
  // 把「全站总数」和「其中多少条是重点」一起写出来：页签上的「全部 229」与报头的
  // 「共 234 条」不是矛盾，而是 234 = 229 + 5。数字关系摊开写，读者不必自己推理。
  line.appendChild(el("span", null,
    ` · 全站共 ${DATA.news.articles.length} 条（其中 ${hlIds.size} 条为重点）`));
}

function renderList(now) {
  const host = $("cards");
  if (!host) return;
  const list = sortArticles(DATA.news.articles.filter((a) => passes(a, now)));
  clear(host);
  const frag = document.createDocumentFragment();
  list.forEach((a) => frag.appendChild(cardFor(a, now)));
  host.appendChild(frag);

  const empty = $("empty");
  if (empty) {
    clear(empty);
    empty.hidden = list.length > 0;
    if (!list.length) {
      empty.appendChild(el("b", null, "没有符合条件的条目。"));
      const conds = activeConditions().map((c) => c.label).join(" / ");
      empty.appendChild(el("span", null, conds ? `当前条件：${conds}` : "当前没有任何筛选条件。"));
      const reset = button("chip", "清空全部条件");
      reset.addEventListener("click", clearAllFilters);
      empty.appendChild(reset);
    }
  }
  renderSummary(list.length);
}
/* ---------------- 信息源状态与运行记录（维护者视角，放在页面下方） ----------------
   顶栏只回答读者的三个问题；成功率、逐源状态、吞吐率这类指标属于维护者，
   放这里，不占首屏，也不冒充「内容」。 */
const STATUS_TEXT = {
  ok: "正常", no_new: "无新增", parse_warning: "解析告警", stale: "疑似停更", failed: "失败", skipped: "本次跳过",
};
const statusDot = (s) => (s === "failed" ? "bad" : s === "parse_warning" || s === "stale" ? "warn" : "ok");
const statusRank = (s) => ({ failed: 0, stale: 1, parse_warning: 2, no_new: 3, ok: 4 }[s] ?? 5);

function renderSources(data) {
  const host = $("srcBody");
  if (!host) return;
  clear(host);
  const status = data.status || {};
  const health = status.health || {};
  const counts = data.news.counts || {};
  const runById = new Map((status.sources || []).map((s) => [s.id, s]));
  const rows = (data.news.sources || []).map((s) => Object.assign({}, s, { run: runById.get(s.id) || {} }));
  rows.sort((a, b) => statusRank(a.run.status) - statusRank(b.run.status) ||
                      String(a.name_en).localeCompare(String(b.name_en)));

  const p = el("p", "panel-note");
  p.textContent =
    `本次运行：${health.ok || 0} 个信源正常、${health.no_new || 0} 个无新增、` +
    `${health.parse_warning || 0} 个解析告警、${health.stale || 0} 个疑似停更、${health.failed || 0} 个失败。` +
    (status.success_rate_7d != null ? `近 7 天成功率 ${(status.success_rate_7d * 100).toFixed(1)}%。` : "") +
    `带图条目 ${counts.with_image || 0} 条 / 共 ${counts.total || rows.length} 条（只取 feed 载荷里的图片地址，不会为配图去请求文章页）。`;
  host.appendChild(p);

  const table = el("table", "srctable");
  const thead = el("thead");
  const hrow = el("tr");
  ["来源", "语言", "本次状态", "抓取", "新增", "用时", "权重"].forEach((t) => hrow.appendChild(el("th", null, t)));
  thead.appendChild(hrow);
  table.appendChild(thead);
  const tbody = el("tbody");
  rows.forEach((s) => {
    const tr = el("tr");
    const c1 = el("td");
    const chip = button("chip", s.name_en);      // 表里的来源名一律用英文展示名
    chip.title = "点击只看该来源";
    chip.addEventListener("click", () => applySourceFilter(s.name_en));
    c1.appendChild(chip);
    if (s.official) c1.appendChild(el("span", "mini", "官方"));
    tr.appendChild(c1);
    tr.appendChild(el("td", "mono", s.lang === "zh" ? "中文" : "英文"));
    const c3 = el("td");
    c3.appendChild(el("span", "dot " + statusDot(s.run.status)));
    c3.appendChild(el("span", null, STATUS_TEXT[s.run.status] || "未记录"));
    tr.appendChild(c3);
    // 数字列要挂 .num，才会命中 td.num{text-align:right} —— 这段 CSS 之前一直是死代码
    tr.appendChild(el("td", "mono num", String(s.run.items_in ?? "—")));
    tr.appendChild(el("td", "mono num", String(s.run.items_new ?? "—")));
    tr.appendChild(el("td", "mono num", s.run.duration_ms != null ? `${(s.run.duration_ms / 1000).toFixed(1)}s` : "—"));
    tr.appendChild(el("td", "mono num", s.weight != null ? String(s.weight) : "—"));
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  host.appendChild(table);

  const runs = ((data.runs || {}).runs || []).slice(-6).reverse();
  if (runs.length) {
    const h4 = el("h4", "panel-h", "最近运行记录");
    host.appendChild(h4);
    const rt = el("table", "srctable");
    const rhead = el("thead");
    const hr = el("tr");
    ["运行时间（北京时间）", "触发", "新增", "去重", "入库总量", "耗时"].forEach((t) => hr.appendChild(el("th", null, t)));
    rhead.appendChild(hr);
    rt.appendChild(rhead);
    const rb = el("tbody");
    runs.forEach((r) => {
      const tr = el("tr");
      const at = parseTime(r.finished_at || r.run_at || r.generated_at || r.started_at);
      tr.appendChild(el("td", "mono", at != null ? fmtStamp(at) : "—"));
      tr.appendChild(el("td", "mono", r.trigger === "cron" ? "定时" : (r.trigger || "手动")));
      tr.appendChild(el("td", "mono num", String(r.total_new ?? "—")));
      tr.appendChild(el("td", "mono num", String(r.total_dup ?? "—")));
      tr.appendChild(el("td", "mono num", String(r.total_in_store ?? "—")));
      tr.appendChild(el("td", "mono num", r.duration_ms != null ? `${(r.duration_ms / 1000).toFixed(1)}s` : "—"));
      rb.appendChild(tr);
    });
    rt.appendChild(rb);
    host.appendChild(rt);
    const last = runs[0];
    if (last && last.duration_ms) {
      const rate = (Number(last.total_new) || 0) / (last.duration_ms / 60e3);
      host.appendChild(el("p", "panel-note",
        `吞吐率 ${rate.toFixed(1)} 条/分钟（本次新增 ÷ 本次耗时）。搬运量（本次抓到多少条）不是维护者该炫的指标，` +
        `这里只放它，方便判断定时任务有没有变慢。`));
    }
  }
}

/* ---------------- 页脚：把「什么不是 AI 做的」写在明面上 ---------------- */
function renderFooter(data) {
  const news = data.news;
  const srcCount = (news.sources || []).length;
  const foot = $("foot");
  if (foot) {
    clear(foot);
    foot.appendChild(el("b", null, "「重要度评分」：入选理由与主题标签均由本地规则计算"));
    foot.appendChild(el("span", null, "，不含任何模型推理；摘要取自来源 feed 的原文摘要，只做截断、不改写，绝不冒充来源原文；"));
    foot.appendChild(el("span", null, "配图只使用 feed 载荷里本来就带的图片地址，不会为配图额外请求文章页。"));
    foot.appendChild(el("b", null, "整站是静态页面：打开时不调用任何外部接口"));
    foot.appendChild(el("span", null, "；已读、收藏与主题偏好只写在你自己的浏览器里（localStorage），不上传任何数据。"));
  }
  const fm = $("footMeta");
  if (fm) fm.textContent =
    `共 ${news.articles.length} 条 · ${srcCount} 个信源 · 抓取窗口 30 天 · 生成于 ${fmtStamp(parseTime(news.generated_at))}（北京时间）`;
  // 诚实版「实时」：这里没有长连接，也没有 WebSocket。写清楚是怎么更新的，
  // 比写一句做不到的「实时监听 16 个信源」有价值。
  const probe = $("probeLine");
  if (probe) probe.textContent =
    `${srcCount} 个信源 · 每日 06:00（北京时间）由定时任务重新抓取并重建本页 · 静态页面，没有长连接，不做实时推送`;
}

/* ---------------- 导出：浏览器端生成文件，不经过任何服务器 ---------------- */
function download(name, text, type) {
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
function currentRows() { return sortArticles(DATA.news.articles.filter((a) => passes(a, Date.now()))); }
function exportJson() {
  const rows = currentRows();
  download(`ai-intel-${fmtStamp(parseTime(DATA.news.generated_at)).slice(0, 10)}.json`,
    JSON.stringify({ generated_at: DATA.news.generated_at, filter: state.filter, count: rows.length, articles: rows }, null, 2),
    "application/json");
}
function exportCsv() {
  const cols = ["id", "title", "source_name_en", "lang", "published_at", "score", "cluster_id", "url"];
  const esc = (v) => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
  const body = currentRows().map((a) => cols.map((k) => esc(a[k])).join(","));
  // 前置 BOM：Excel 直接打开中文才不乱码
  download(`ai-intel-${fmtStamp(parseTime(DATA.news.generated_at)).slice(0, 10)}.csv`,
    "\ufeff" + [cols.join(",")].concat(body).join("\r\n"),
    "text/csv;charset=utf-8");
}

/* ---------------- 事件绑定 ---------------- */
function rememberVisit() {
  // 读完上一次的值再写新的：这样「自上次来访新增」在真正回头访问时才算得出来。
  storeSet(STORE_KEYS.lastVisit, new Date().toISOString());
}

function bindEvents() {
  const q = $("q");
  if (q) q.addEventListener("input", () => { state.q = q.value.trim(); renderAll(Date.now()); });

  const dup = $("dupToggle");
  if (dup) dup.addEventListener("change", () => { state.dup = dup.checked; renderAll(Date.now()); });

  const sort = $("sort");
  if (sort) sort.addEventListener("change", () => { state.sort = sort.value; renderList(Date.now()); });

  const theme = $("themeToggle");
  if (theme) theme.addEventListener("click", toggleTheme);

  const reload = $("reloadBtn");
  if (reload) reload.addEventListener("click", () => window.location.reload());

  const backTop = $("backTop");
  if (backTop) backTop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));

  const close = $("modalClose");
  if (close) close.addEventListener("click", closeModal);
  const modal = $("modal");
  if (modal) modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeModal();
    if ((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === "k") {
      e.preventDefault();
      if (q) q.focus();
    }
  });

  const ej = $("exportJson");
  if (ej) ej.addEventListener("click", exportJson);
  const ec = $("exportCsv");
  if (ec) ec.addEventListener("click", exportCsv);
}

/* ---------------- 启动 ---------------- */
function renderAll(now) {
  renderHeader(DATA);
  renderHighlights(DATA, now);
  renderTabs();
  renderActiveFilters();
  renderLedger();
  renderRunLine();
  renderList(now);
}

function renderRunLine() {
  const host = $("runLine");
  if (!host) return;
  clear(host);
  const runs = ((DATA.runs || {}).runs || []);
  const last = runs[runs.length - 1];
  if (!last) { host.textContent = "运行记录缺失"; return; }
  const secs = last.duration_ms != null ? (last.duration_ms / 1000).toFixed(1) : "—";
  host.textContent = `最近一次运行 ${secs} 秒 · 新增 ${last.total_new ?? "—"} 条 · 去重 ${last.total_dup ?? "—"} 条 · 入库 ${last.total_in_store ?? "—"} 条`;
}

async function init() {
  const data = await loadData();
  if (!data || !data.news || !Array.isArray(data.news.articles)) {
    fail("情报数据未能载入", "内联数据为空，且 fetch data/*.json 也没拿到");
    return;
  }
  DATA = data;
  computeHlIds();
  loadVisitState(DATA.news);
  renderAll(Date.now());
  renderSources(DATA);
  renderFooter(DATA);
  bindEvents();
  rememberVisit();
  window.__APP_READY__ = true;   // 供无头校验脚本等待渲染完成
}

init();
</script>
