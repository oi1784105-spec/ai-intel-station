<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日 AI 情报站</title>
<meta name="description" content="每天自动汇总中文与英文来源的 AI 情报，含跨源事件聚合与可解释的重点推荐。">
<script>
// 主题必须在首次绘制前定好，否则会先闪一下深色再切浅色。
// 故这段刻意放在 <head> 里同步执行，而不是等下面主脚本的 DOMContentLoaded。
// 注意：键名 `ai-intel-theme` 与主脚本里的 STORE_KEYS.theme 是同一份字面量，改名要两处一起改。
(function () {
  var theme;
  try {
    theme = localStorage.getItem("ai-intel-theme");
    if (theme !== "light" && theme !== "dark") {
      theme = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches)
        ? "light" : "dark";
    }
  } catch (error) {
    theme = "dark";
  }
  document.documentElement.setAttribute("data-theme", theme);
})();
</script>
<style>
/* ============================================================
   设计语言：瑞士报刊编排（Editorial Ledger）
   浅色 = 未漂白书纸 + 炭墨 + 氧化赭石点缀；深色 = 黑曜石账本。
   两条铁律：① 一律 0 圆角；② 分区只靠 1px 发丝线，不用阴影。
   字体全部走本机字体栈 —— 设计稿原型的 Newsreader / JetBrains Mono /
   Inter 要经 Google Fonts 加载，本页必须零外部请求（双击可开、国内直连可用），
   故换成等价的衬线 / 等宽 / 无衬线系统栈，视觉意图不变。
   ============================================================ */

/* 深色是默认值；浅色由 `[data-theme="light"]` 覆盖。
   主题值一律由 JS 显式写到 <html> 上（含「跟随系统」的解析结果），
   这样调色板只需定义一份，不必在媒体查询里再复制一遍。 */
:root{
  color-scheme:dark;
  /* 字体：设计稿原型用 Google Fonts 的 Newsreader / JetBrains Mono / Inter，
     本页要求零外部请求（双击可开、国内直连可用），故换成等价系统栈。
     Latin 走 Georgia / Consolas / Segoe UI，中文字形按字回退到宋体 / 微软雅黑。
     注意：这三个变量必须在 :root 里声明 —— 缺一个，用到它的那条 font 简写就会
     在计算期整条失效（字号偷偷回落到浏览器默认 16px），页面上不会报错。 */
  --serif:Georgia,"Source Han Serif SC","Noto Serif CJK SC","Songti SC",SimSun,"Times New Roman",serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"JetBrains Mono","Courier New",SimSun,monospace;
  --sans:"Inter","Segoe UI",system-ui,-apple-system,"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;
  --bg:#111315; --bg-alt:#121416; --surface:#181a1c; --surface-low:#16181a;
  --surface-container:#1c1e21; --surface-high:#232629; --hover:#1a1c20;
  --fg:#e6e4df; --fg-2:#b0b2b7; --fg-dim:#84868c; --fg-faint:#5c5e64;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14); --line-strong:rgba(255,255,255,.26);
  --ink:#e6e4df; --on-ink:#111315;
  --rust:#c46a3b; --spruce:#4e7d67; --peach:#ffb693; --sage:#a0d1b8;
  --ok:#4e7d67; --warn:#c46a3b; --bad:#ffb4ab;
  --scrim:rgba(6,7,8,.68);
  --thumb-bg:#0c0e10;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#fbf9f4; --bg-alt:#f7f5ef; --surface:#ffffff; --surface-low:#f5f3ee;
  --surface-container:#f0eee9; --surface-high:#eae8e3; --hover:#faf9f6;
  --fg:#1b1c19; --fg-2:#3f413c; --fg-dim:#5f615c; --fg-faint:#8b8c86;
  --line:#e5e2da; --line-2:#d8d3c8; --line-strong:#b8b2a4;
  --ink:#111110; --on-ink:#fbf9f4;
  --rust:#934a24; --spruce:#233e33; --peach:#76340e; --sage:#334c40;
  --ok:#2e473b; --warn:#8a431d; --bad:#ba1a1a;
  --scrim:rgba(27,28,25,.42);
  --thumb-bg:#11110f;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:400 13px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
::selection{background:var(--fg); color:var(--bg)}
:focus-visible{outline:none; border-color:var(--fg) !important}
/* 设计稿是「零圆角 + 发丝线」，滚动条也一并收细，避免破坏版面节奏 */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--line-2);border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--line-strong)}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

.wrap{max-width:1400px;margin:0 auto;padding:0 24px}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.01em}
.serif{font-family:var(--serif)}
.spacer{flex:1 1 auto}

/* ---------------- 报头（Masthead） ---------------- */
.masthead{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 95%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.mast-in{display:flex;align-items:center;justify-content:space-between;gap:18px;min-height:52px;padding:8px 24px}
.mast-left{display:flex;align-items:baseline;gap:18px;min-width:0}
.brand{display:flex;align-items:baseline;gap:10px;flex-shrink:0}
.brand-name{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:-.01em;line-height:1}
.edition{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--fg-dim);text-transform:uppercase}
.telemetry{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;
  color:var(--fg-2);padding-left:16px;border-left:1px solid var(--line);min-width:0}
.telemetry .sep{color:var(--fg-faint)}
.telemetry b{color:var(--fg);font-weight:500}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--fg-dim);flex-shrink:0}
.dot.ok{background:var(--ok)}
.dot.warn{background:var(--warn)}
.dot.bad{background:var(--bad)}
.mast-right{display:flex;align-items:center;gap:14px;flex-shrink:0}
.searchbox{position:relative;display:flex;align-items:center}
.searchbox svg{position:absolute;left:8px;width:13px;height:13px;color:var(--fg-dim);pointer-events:none}
.searchbox input{
  width:190px;height:28px;padding:0 44px 0 26px;font:400 12px var(--sans);
  background:transparent;border:1px solid var(--line-2);border-radius:0;color:var(--fg);
}
.searchbox input::placeholder{color:var(--fg-dim)}
.searchbox input:focus{border-color:var(--fg);background:var(--surface);outline:none}
.kbd{position:absolute;right:6px;font-family:var(--mono);font-size:9px;color:var(--fg-dim);
  border:1px solid var(--line-2);background:var(--surface-low);padding:1px 4px;pointer-events:none}
.readmeter{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--fg-2);
  padding-left:16px;border-left:1px solid var(--line)}
.readmeter .bar{width:52px;height:3px;background:var(--surface-high)}
.readmeter .bar i{display:block;height:100%;background:var(--fg);width:0}
.readmeter b{color:var(--fg);font-weight:500}
.mast-actions{display:flex;align-items:center;gap:2px}
.icon-btn{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;
  color:var(--fg-2);border:1px solid transparent}
.icon-btn:hover{color:var(--fg);background:var(--surface-container)}
.icon-btn svg{width:15px;height:15px}
.i-sun{display:none}
:root[data-theme="light"] .i-moon{display:none}
:root[data-theme="light"] .i-sun{display:block}

/* ---------------- 区块标题（Section Deck） ---------------- */
.deck{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:16px}
.deck-left{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.deck h2{font-family:var(--serif);font-size:24px;font-weight:500;letter-spacing:-.01em;margin:0;color:var(--fg)}
.deck-sub{font-size:12px;color:var(--fg-2)}
.deck-right{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--fg-2);white-space:nowrap}
.deck-right .sq{width:6px;height:6px;background:var(--fg);display:inline-block}

/* ---------------- 今日重点：非对称头条版式 ---------------- */
/* 网格保持默认 stretch：特稿与侧栏等高，中间那条竖向分隔线才画得满一整行
   （改成 align-items:start 会让分隔线只画到特稿内容的高度，看着像断线）。
   特稿自身的留白不靠拉伸撑，而靠「同一事件的其他来源」这段真内容去填。 */
.lead-grid{display:grid;grid-template-columns:1fr;border:1px solid var(--line);background:var(--surface)}
@media (min-width:1024px){
  .lead-grid{grid-template-columns:repeat(12,1fr)}
  .lead-hero{grid-column:span 7;border-right:1px solid var(--line)}
  .lead-side{grid-column:span 5}
}
/* 特稿配图：16:9 裁切，高度由宽度决定，两种版式下都不会忽高忽低 */
.lead-fig{margin:0;border:1px solid var(--line);overflow:hidden}
.lead-fig img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
/* 无配图时给一行克制的说明，而不是留一块看不出所以然的空白 */
.lead-noimg{display:block;font-family:var(--mono);font-size:11px;color:var(--fg-faint);
  border:1px dashed var(--line-2);padding:6px 8px}
/* 特稿摘要不裁行数：头条的摘要该让人读完一句话，而不是掐成两行 */
.lead-hero .lead-sum{display:block;overflow:visible;-webkit-line-clamp:unset}
/* 同题报道清单：特稿成为头条的主要理由就是「多家来源交叉」，
   那就把这几家当场列出来（真数据，不是装饰），顺带把版面撑实。 */
.lead-cross{margin-top:auto;border-top:1px dashed var(--line-2);padding-top:10px}
.lead-cross-h{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--fg-faint);
  margin-bottom:6px}
.lead-cross-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lead-cross-list li{display:flex;align-items:baseline;gap:8px;font-size:12px}
.lead-cross-list .src{font-family:var(--mono);font-size:10px;color:var(--fg-dim);flex-shrink:0;
  border:1px solid var(--line);padding:1px 5px}
.lead-cross-list .cross-title{color:var(--fg-2);flex:1 1 auto;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.lead-cross-list .cross-title:hover{color:var(--fg)}
.lead-cross-list .t{font-family:var(--mono);font-size:10px;color:var(--fg-faint);flex-shrink:0}
.lead-hero{display:flex;flex-direction:column;justify-content:space-between;
  padding:24px 26px;border-bottom:1px solid var(--line);transition:background .15s}
@media (min-width:1024px){.lead-hero{border-bottom:0}}
.lead-hero:hover{background:var(--hover)}
.lead-no{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;
  font-family:var(--mono);font-size:11px;color:var(--fg-2);margin-bottom:12px}
.lead-no .who{display:flex;align-items:center;gap:8px;min-width:0}
.lead-no .no{font-weight:600;color:var(--fg);text-decoration:underline;
  text-decoration-color:var(--line-strong);text-underline-offset:4px}
.lead-no .pts{font-weight:600;color:var(--fg)}
.lead-hero h3{font-family:var(--serif);font-size:27px;line-height:1.28;font-weight:400;
  letter-spacing:-.01em;margin:0 0 12px;color:var(--fg)}
@media (min-width:768px){.lead-hero h3{font-size:31px}}
.lead-hero:hover h3{color:var(--fg-2)}
.lead-hero .sum{font-family:var(--serif);font-size:15px;line-height:1.7;color:var(--fg-2);margin:0 0 16px}
@media (min-width:768px){.lead-hero .sum{font-size:16px}}
.cross-note{font-size:11px;color:var(--fg-2);background:var(--surface-container);padding:2px 6px;flex-shrink:0}
/* 配图只在来源 feed 本来就带图时出现（本期 27.4% 的条目有图）。
   没有就整块不渲染 —— 绝不为了凑版面去抓文章页或塞占位大图。 */
.figure{border:1px solid var(--line);background:var(--thumb-bg);overflow:hidden;margin:0 0 16px}
.figure img{width:100%;height:auto;max-height:300px;object-fit:cover;object-position:center}
.figure figcaption{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:6px 10px;background:var(--surface-low);border-top:1px solid var(--line);
  font-family:var(--mono);font-size:10px;color:var(--fg-2)}
.lead-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;
  padding-top:16px;border-top:1px solid var(--line)}
.tags{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-family:var(--mono);font-size:11px}
.tag-btn{color:var(--fg-2);border:0;padding:0}
.tag-btn:hover{color:var(--fg)}
.tags .sep{color:var(--fg-faint)}
.dispatch{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;
  font-weight:500;color:var(--fg)}
.dispatch:hover{text-decoration:underline;text-underline-offset:4px}
.dispatch svg{width:13px;height:13px}
/* 侧栏 #02–#05：一条发丝线分隔，不再逐块加边框。
   桌面端按特稿高度等分：每条被拉满、内容垂直居中，多出来的空间均匀落在每条上下。
   不这么做时，侧栏内容短于带图特稿，差的 240px 会在右栏底部攒成一整块纯背景空洞。 */
.lead-side{display:flex;flex-direction:column}
.lead-side>*+*{border-top:1px solid var(--line)}
@media (min-width:1024px){
  .lead-side>.lead-item,.lead-side>.lead-mini{flex:1 1 0}
  .lead-side>.lead-item,.lead-side>.lead-mini>.lead-item{
    display:flex;flex-direction:column;justify-content:center}
}
.lead-item{padding:18px 20px;transition:background .15s}
.lead-item:hover{background:var(--hover)}
.lead-item .row{display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-family:var(--mono);font-size:11px;color:var(--fg-2);margin-bottom:8px}
.lead-item .row .idx{font-weight:600;color:var(--fg)}
.lead-body{display:flex;gap:14px}
.lead-body .txt{flex:1 1 auto;min-width:0}
.lead-item h4{font-family:var(--serif);font-size:16px;line-height:1.45;font-weight:500;
  margin:0 0 6px;color:var(--fg)}
.lead-item:hover h4{color:var(--fg-2)}
.lead-item p{font-size:12px;line-height:1.7;color:var(--fg-2);margin:0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lead-thumb{width:112px;height:80px;flex-shrink:0;border:1px solid var(--line);
  background:var(--thumb-bg);overflow:hidden}
.lead-thumb img{width:100%;height:100%;object-fit:cover;object-position:center}
.lead-mini{display:grid;grid-template-columns:1fr}
@media (min-width:640px){.lead-mini{grid-template-columns:1fr 1fr}}
.lead-mini>*+*{border-top:1px solid var(--line)}
@media (min-width:640px){
  .lead-mini>*+*{border-top:0;border-left:1px solid var(--line)}
  .lead-mini>*:nth-child(2n){border-left:0}
}
.lead-mini .lead-item{padding:14px 16px}
.lead-mini h5{font-family:var(--serif);font-size:15px;line-height:1.45;font-weight:500;margin:0 0 6px;
  color:var(--fg);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lead-mini .lead-item:hover h5{color:var(--fg-2)}
.lead-mini .sig{font-family:var(--mono);font-size:10px;color:var(--fg-2);margin-top:8px}
/* 窄屏轮播的控制条（← 分页指示器 →）。轮播只在 <1024px 存在，所以这条在桌面恒为
   display:none —— 桌面版式与像素都不受影响；窄屏那段再把它打开。 */
.hl-bar{display:none}
/* ---------------- 编排控制台：账本行 + 分类页签 + 检索算符 ---------------- */
.console{border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  background:var(--surface);padding:12px 0;margin-top:32px}
.console-in{padding:0 24px}
.ledger{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;
  font-family:var(--mono);font-size:11px;color:var(--fg-2)}
.ledger-l{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-width:0}
.ledger-l .sep{color:var(--fg-faint)}
.ledger-l b{color:var(--fg);font-weight:500}
.ledger-actions{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
/* 页签即按钮：当前项用实心墨块，其余透明 —— 与设计稿的主/次按钮规则一致 */
.tabs{display:flex;flex-wrap:wrap;align-items:center;gap:1px;font-family:var(--mono);font-size:11px;
  padding-top:10px;border-top:1px solid var(--line);margin-top:10px}
.tab{padding:4px 12px;color:var(--fg-2);white-space:nowrap}
.tab:hover{color:var(--fg);background:var(--surface-container)}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);font-weight:500}
.tab .n{color:var(--fg-faint);margin-left:6px}
.tab[aria-pressed="true"] .n{color:inherit;opacity:.75}
.ops{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;
  padding-top:10px}
.ops .sep{color:var(--fg-faint)}
.check{display:inline-flex;align-items:center;gap:6px;color:var(--fg-2);cursor:pointer;user-select:none}
.check:hover{color:var(--fg)}
.check input{appearance:none;width:13px;height:13px;border:1px solid var(--line-strong);
  border-radius:0;background:transparent;margin:0;cursor:pointer;position:relative}
.check input:checked{background:var(--ink);border-color:var(--ink)}
.check input:checked::after{content:"";position:absolute;inset:3px;background:var(--on-ink)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);
  background:var(--surface-low);color:var(--fg-2);padding:2px 7px}
.chip:hover{color:var(--fg);border-color:var(--line-strong)}
/* 分类页签是「文字页签」：默认无边框，靠字重与底色区分，选中项填充墨色 */
#filters .chip{padding:4px 12px;background:transparent;border-color:transparent}
/* 选中态与悬停必须带 id 前缀：`#filters .chip`（id+类）会盖掉 `.tab[aria-pressed]`（类+属性），
   不加这两条，选中页签的文字色会落到 --on-ink 而填充色被吃成透明 —— 深色主题下等于隐形。 */
#filters .chip:hover{color:var(--fg)}
#filters .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
/* 源表里的来源名做成下划线链接样：点它即筛到该来源 */
#srcBody .chip{border:0;padding:0;background:none;color:var(--fg);text-decoration:underline;
  text-decoration-style:dotted;text-decoration-color:var(--fg-dim);text-underline-offset:3px}
#srcBody .chip:hover{text-decoration-color:var(--fg)}
/* 账本行的操作组靠右：`.acts` 吃掉左侧剩余空间 */
.ledger-l .acts{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
/* 卡片正文：文字列自适应、缩略图盒子固定 —— 列宽不因有无配图而跳动 */
.card-main{display:flex;align-items:flex-start;gap:12px}
.card-txt{flex:1 1 auto;min-width:0}
.hero-sec{padding-top:28px}
/* 报头主标题是 h1：抹掉 UA 默认外边距，视觉上仍只是报头里那一行刊名 */
h1.brand-name{margin:0;font-weight:600}
.ops select{appearance:none;background:transparent;border:1px solid var(--line-2);border-radius:0;
  font-family:var(--mono);font-size:11px;color:var(--fg);padding:3px 26px 3px 8px;cursor:pointer}
.ops select:focus{border-color:var(--fg);outline:none}
.ops .selwrap{position:relative;display:inline-flex;align-items:center}
.ops .selwrap svg{position:absolute;right:6px;width:12px;height:12px;color:var(--fg-dim);pointer-events:none}
.countline{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;
  padding-top:8px;font-family:var(--mono);font-size:11px;color:var(--fg-2)}
.af-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:10px;
  font-family:var(--mono);font-size:11px}
/* `hidden` 必须比 `.af-row{display:flex}` 更强势，否则「无筛选条件时整行收起」会失效：
   属性选择器的权重低于类选择器，不写这一条，空指示条会一直占着一行。 */
.af-row[hidden]{display:none}
.af-label{color:var(--fg-dim)}
.af-token{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);
  color:var(--fg);padding:2px 7px}
.af-token:hover{background:var(--surface-container)}
.af-token .x{color:var(--fg-dim)}
.af-clear{border:1px solid var(--line-2);color:var(--fg-2);padding:2px 7px}
.af-clear:hover{border-color:var(--fg);color:var(--fg)}

/* ---------------- 情报卡片：三列发丝线栅格 ---------------- */
.cards{list-style:none;margin:24px 0 0;padding:0;display:grid;grid-template-columns:1fr;
  border:1px solid var(--line);background:var(--surface)}
@media (min-width:768px){.cards{grid-template-columns:1fr 1fr}}
@media (min-width:1180px){.cards{grid-template-columns:1fr 1fr 1fr}}
.card{display:flex;flex-direction:column;justify-content:space-between;gap:12px;padding:20px;
  border-bottom:1px solid var(--line);transition:background .15s}
@media (min-width:768px){.card{border-right:1px solid var(--line)}}
@media (min-width:1180px){.card:nth-child(3n){border-right:0}}
@media (min-width:768px) and (max-width:1179px){.card:nth-child(2n){border-right:0}}
.card:hover{background:var(--hover)}
/* 已读条目压暗但不隐藏：让位给未读，仍可回看。判据与「只看未读」同源。 */
.card.read{opacity:.55}
.card.read:hover{opacity:1}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-src{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.code{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--fg);
  border:1px solid var(--line-2);background:var(--surface-low);padding:1px 5px}
.swatch{width:8px;height:8px;border-radius:0;flex-shrink:0}
.card-src .nm{font-size:12px;font-weight:500;color:var(--fg)}
.card-src button.nm:hover{text-decoration:underline;text-underline-offset:3px}
.card-src .t{font-family:var(--mono);font-size:11px;color:var(--fg-dim)}
.bookmark{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;
  color:var(--fg-dim);flex-shrink:0}
.bookmark:hover{color:var(--fg)}
.bookmark svg{width:15px;height:15px}
.bookmark.on{color:var(--rust)}
.bookmark.on svg{fill:currentColor}
/* 语言标签是「按语言筛列表」的入口，必须做成看得见的实心小标签：
   之前只是一段 11px 裸文字，深色主题下几乎认不出那是控件。 */
.lang{font-family:var(--mono);font-size:10px;letter-spacing:.06em;line-height:1;
  padding:3px 6px;border:1px solid var(--line-2);background:var(--surface-low);color:var(--fg-2)}
.lang:hover{color:var(--fg);border-color:var(--line-strong)}
.lang[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.card h3{font-family:var(--serif);font-size:17px;line-height:1.45;font-weight:500;margin:0 0 8px;color:var(--fg);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card:hover h3{color:var(--fg-2)}
.card p{font-size:12px;line-height:1.7;color:var(--fg-2);margin:0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sum-src{display:block;font-family:var(--mono);font-size:10px;color:var(--fg-dim);margin-top:6px}
.card .shot{height:112px;border:1px solid var(--line);background:var(--thumb-bg);overflow:hidden;margin:0 0 12px}
.card .shot img{width:100%;height:100%;object-fit:cover;object-position:center}
/* 无图占位块：中性边框 + 源色淡底 + 源色字母标识，一眼看出是设计的一部分，
   不会被误读成图片加载失败。色相由 JS 提供，具体色值交给主题。 */
.thumb{width:108px;height:80px;flex-shrink:0;border:1px solid var(--line);background:var(--thumb-bg);
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb.ph{background:hsl(var(--src-hue,0) 30% 18%);color:hsl(var(--src-hue,0) 60% 78%)}
:root[data-theme="light"] .thumb.ph{background:hsl(var(--src-hue,0) 44% 93%);color:hsl(var(--src-hue,0) 40% 32%)}
.thumb.ph span{font-family:var(--mono);font-size:16px;font-weight:600;letter-spacing:.04em}
.card-media{display:flex;gap:12px;margin-bottom:12px}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding-top:12px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--fg-2)}
.card-foot .l{display:flex;align-items:center;gap:8px;min-width:0}
.card-foot .r{color:var(--fg-dim);white-space:nowrap}
.badge{color:var(--fg-2)}
.badge-btn{border:0;padding:0;color:var(--fg-2);text-decoration:none}
.badge-btn:hover{color:var(--fg);text-decoration:underline;text-underline-offset:2px}
.badge.official{color:var(--spruce)}
.badge.sig{color:var(--fg-2)}
.badge.note{color:var(--warn)}
.lang{border:0;padding:0;color:var(--fg);text-decoration:underline;
  text-decoration-color:var(--line-strong);text-underline-offset:2px}
.lang:hover{text-decoration-color:var(--fg)}
.empty{padding:40px 24px;text-align:center;color:var(--fg-2);font-size:13px}

/* ---------------- 数据面板（来源状态与运行记录） ---------------- */
.panel{margin:32px 0 0;border:1px solid var(--line);background:var(--surface)}
.panel>summary{padding:12px 18px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--fg-2);cursor:pointer;list-style:none;
  display:flex;align-items:center;justify-content:space-between;gap:10px}
.panel>summary::-webkit-details-marker{display:none}
.panel>summary:hover{color:var(--fg)}
.panel>summary::after{content:"＋";font-size:13px}
.panel[open]>summary{border-bottom:1px solid var(--line);color:var(--fg)}
.panel[open]>summary::after{content:"－"}
.panel-in{padding:16px 18px 20px}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--fg-dim);text-align:left;font-weight:500;padding:6px 10px;
  background:var(--surface-low);border-bottom:1px solid var(--line-2);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line);color:var(--fg-2);vertical-align:middle}
tbody tr:hover td{background:var(--hover)}
td.num{font-family:var(--mono);text-align:right}
td b{color:var(--fg);font-weight:500}
.panel .link{border:0;padding:0;font-size:12.5px;color:var(--fg);text-decoration:underline;
  text-decoration-color:var(--line-strong);text-underline-offset:2px}
.panel .link:hover{text-decoration-color:var(--fg)}
.panel h4{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--fg-dim);font-weight:500;margin:18px 0 8px}
.err{border:1px solid var(--bad);border-left-width:2px;background:var(--surface);
  padding:14px 16px;color:var(--fg);font-size:13px}
.err b{color:var(--bad)}

/* ---------------- 跨源事件浮层 ---------------- */
/* 刻意不用 <dialog>：个别浏览器对它的定位与层级处理不一致，
   而这里只需要一个「点开看全部来源链接」的轻量浮层。 */
.modal{position:fixed;inset:0;z-index:100;background:var(--scrim);display:flex;
  align-items:center;justify-content:center;padding:24px}
.modal[hidden]{display:none}
.modal-card{width:100%;max-width:720px;max-height:80vh;display:flex;flex-direction:column;
  background:var(--surface-container);border:1px solid var(--line-strong)}
.modal-head{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.modal-head b{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--fg);font-weight:500}
.modal-body{overflow-y:auto;padding:6px 0 0}
.modal-item{display:grid;grid-template-columns:160px 1fr auto;gap:12px;align-items:baseline;
  padding:10px 16px;border-bottom:1px solid var(--line)}
.modal-item:hover{background:var(--surface-high)}
.mi-src{border:0;padding:0;font-family:var(--mono);font-size:11px;text-align:left}
.mi-title{font-family:var(--serif);font-size:14px;line-height:1.5;color:var(--fg)}
.mi-title:hover{text-decoration:underline;text-underline-offset:3px}
.mi-time{font-family:var(--mono);font-size:10px;color:var(--fg-dim);white-space:nowrap}
.modal-note{padding:12px 16px;margin:0;font-size:12px;color:var(--fg-2);border-top:1px solid var(--line)}

/* ---------------- 页脚 ---------------- */
.lander{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;
  padding:14px 0;border-top:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--fg-2)}
.lander .l{display:flex;align-items:center;gap:8px}
footer{border-top:1px solid var(--line);background:var(--bg-alt);margin-top:8px}
.foot-in{display:flex;flex-direction:column;gap:14px;padding:28px 24px}
.foot-brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px}
.foot-brand .nm{font-family:var(--serif);font-size:16px;font-weight:600;color:var(--fg)}
footer p{margin:0;font-size:12px;line-height:1.75;color:var(--fg-2);max-width:96ch}
footer p b{color:var(--fg);font-weight:500}
footer code{font-family:var(--mono);font-size:11px;background:var(--surface-container);
  padding:1px 5px;color:var(--fg)}
.foot-nav{display:flex;flex-wrap:wrap;align-items:center;gap:18px;font-family:var(--mono);font-size:11px}
.foot-nav button,.foot-nav a{color:var(--fg-2);border:0;padding:0}
.foot-nav button:hover,.foot-nav a:hover{color:var(--fg);text-decoration:underline;text-underline-offset:4px}
.foot-nav .hi{color:var(--fg)}

@media (max-width:1080px){.telemetry{display:none}}
@media (max-width:860px){
  .readmeter{display:none}
  /* 150px 时占位文字放不下（需要 26+81+44=151px），放到 210px */
  .searchbox input{width:210px}
  .mast-left{gap:10px}
  .modal-item{grid-template-columns:1fr;gap:4px}
}
/* ---------------- 窄屏（<1024px：手机与竖屏平板） ----------------
   电脑端版式由 @media (min-width:1024px) 的 12 栏网格负责，下面这段只在窄屏生效，
   ≥1024px 的渲染逐字节不受影响。 */
@media (max-width:1023px){
  /* ① 横向溢出。「今日重点」在窄屏是单栏 1fr 网格，而 1fr 轨道的自动最小值会取内容的
     min-content：「同一事件的其他来源报道」那条 white-space:nowrap 的标题把轨道撑到 531px，
     390px 视口下整页被拖到 549px（右侧一截全被裁掉）。
     处方与 .card-txt 一致 —— 给网格项显式 min-width:0，省略号机制才能接管。 */
  .lead-grid,.lead-hero,.lead-side,.lead-side>*{min-width:0}
  .lead-cross-list li{min-width:0}
  /* 同类隐患一次兜住：手机/平板上凡是 1fr 轨道，自动最小值都取内容 min-content。
     这一节里 .lead-grid 已经钉过，同源的 .lead-mini 与 .cards 也钉上（不影响正常宽度，
     只在「内容比轨道还宽」时生效，避免整页被顶出屏幕）。 */
  .lead-mini>*{min-width:0}
  .cards>*{min-width:0}
  /* ② 数据面板的源表是 table-layout:auto，单元格的最小宽度把表撑到 364px，
     展开后整页被拖到 422px。让它在面板内部自己横向滚动。 */
  .panel-in{overflow-x:auto}

  /* ③ 触控尺寸 —— 这是「手指 vs 鼠标」的问题，不是版式问题，所以手机与平板同待遇：
     图标位 38px；文字型筛选控件（来源/语言/理由/跨源标签等）拉起 32px 高。
     桌面 17–20px 的文字链给鼠标够用，手指不行 —— 手机端最细的是「语言」筛选，只有 11×10px。 */
  .icon-btn{width:38px;height:38px}
  .icon-btn svg{width:17px;height:17px}
  .searchbox input{height:38px}
  .tabs{gap:4px}
  .tab,.chip{padding:8px 12px}
  #filters .chip{padding:8px 14px}
  .af-token,.af-clear{padding:6px 10px}
  .ops{padding-top:12px;gap:12px}
  .ops select{padding:8px 28px 8px 10px}
  .check input{width:16px;height:16px}
  .bookmark{width:36px;height:36px}
  .dispatch,.why{padding:6px 0}
  .brand,.hl-src,.nm,.why,.dispatch,.lang,.badge-btn,.badge.cluster,.af-x,.af-clear,.af-token,
  .ops select,.op-chip,.foot-nav a,.foot-nav button,.lander a,.fnote a{min-height:32px;
    display:inline-flex;align-items:center}
  .lang{padding:0 4px}
  .af-x{justify-content:center;min-width:26px}
  #srcBody .chip{min-height:32px;padding:4px 0}

  /* ④ 窄屏「今日重点」改横向 Banner 轮播：同一区域、同一时间只展示一条重点。
     桌面那套 12 栏网格原封不动（改不到），窄屏这里只改布局与交互：
     · display:contents 拆掉 .lead-side / .lead-mini 两个纯包装盒，让每张重点卡（都带 .hl）
       自己成为一屏 —— DOM 结构一个节点都不动，所以桌面渲染逐字节不变；
       （注意：display:contents 只改布局归属、不改选择器匹配树，所以下面一律用后代选择器
        #highlights .hl —— 本轮就先用子选择器 .lead-grid>.hl 写过一版，结果拆盒后的 4 屏
        全被压成 32px，探针一眼看出来。）
     · 滑动靠原生滚动 + scroll-snap：手指拖动是浏览器自己的行为，不会和卡片上的点击抢事件；
       自动播放与箭头只做「滚到第 k 屏」，左右滑动动画由 scroll-behavior:smooth 给（不是闪切）；
     · 每屏自带 1px 描边 + surface 底色（沿用 --line / --surface），所以边框不靠
       「相邻兄弟加线」那套，拆盒后不会缺边。 */
  .lead-grid{display:flex;flex-wrap:nowrap;align-items:stretch;gap:12px;
    padding:2px 32px 6px 0;   /* 右内距 = 屏宽让出的那 32px：最后一屏才吸得齐左缘 */
    border:0;background:transparent;overflow-x:auto;overflow-y:hidden;
    scroll-snap-type:x mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;
    scrollbar-width:none}
  .lead-grid::-webkit-scrollbar{display:none}
  .lead-side,.lead-mini{display:contents}
  #highlights .hl{flex:0 0 100%;min-width:0;
    scroll-snap-align:start;scroll-snap-stop:always;
    border:1px solid var(--line);background:var(--surface);
    display:flex;flex-direction:column;justify-content:flex-start}
  /* 屏宽 = 轨道内容宽（= 轨道宽 − 32px 右内距），于是静止时下一屏正好露出 20px 的边：
     看得出左右还有内容、现在停在第几条；滑动时也是「上一屏 → 当前 → 下一屏」
     一路横向挪过去，不是整块闪换。 */
  /* 每屏高度由最高那屏（头条）决定，矮的那几屏余量落在哪是要紧的：
     内容堆在顶部、标签行用 margin-top:auto 钉在底部（跟头条的 .lead-cross 同一招），
     余量集中成一条「正文与标签之间」的空档 —— 比把内容浮在正中好看，也不像破图。
     有配图的那几屏再让缩略图吃掉余量：竖着撑满脚部，留白就没了。 */
  #highlights .hl .lead-foot{margin-top:auto}
  #highlights .lead-item:has(.lead-thumb) .lead-foot{flex:1 1 auto;align-items:flex-end}
  #highlights .lead-thumb{height:auto;min-height:80px;align-self:stretch}
  /* 正文摘要自己吃掉余量：每屏高度由最高那屏定，矮的几屏与其留一大块白，
     不如多显示几行正文（末尾仍是省略号，看到「…」就知道还有内容）。
     这样空白由数据自己填 —— 摘要长就多显示，短就少显示，不用写死高度。 */
  #highlights .hl .lead-sum,#highlights .lead-item p{flex:1 1 auto;min-height:0}
  /* 头条那屏的配图在窄屏收起。它是唯一带大图的卡（其余带图的卡只有 112×80 缩略图），
     图一留着整条轮播就被它顶到 520px 高，而矮的几屏只有 270px 内容 —— 中间空出一大片
     「正文与标签之间的白」。收掉图，整条落到 ~380px：带缩略图的那两屏由缩略图竖着撑满，
     纯文字的那两屏余量不到三成，看着是留白不是破图。
     图不是丢了：电脑端照旧显示大图，手机上这条情报在下方「全部情报」的卡片里
     仍带自己的配图（thumbFor 会渲染）。取舍已写进 DEVLOG。 */
  #highlights .lead-fig{display:none}
  /* 标题与正文用省略号收，不是硬切：看到「…」就知道还有内容，完整版在原文与下方列表里。
     注意 line-clamp 必须配 display:-webkit-box 才生效（本轮就差点写出第三条死规则）。 */
  #highlights .lead-hero h3,#highlights .lead-item h4,#highlights .lead-mini h5{
    display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
  #highlights .lead-hero h3{font-size:20px;-webkit-line-clamp:3}
  #highlights .lead-hero .lead-sum{display:-webkit-box;-webkit-box-orient:vertical;
    overflow:hidden;-webkit-line-clamp:4}
  #highlights .lead-item h4,#highlights .lead-mini h5{-webkit-line-clamp:3}
  /* 控制条：左右箭头、每一颗分页指示点、暂停/播放都是真按钮，点了就真起作用；
     指示点的触控高度给到 32px（手指问题），视觉上仍是 8px 的小方点。 */
  .hl-bar{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:14px;
    margin-top:14px}
  .hl-arrow{width:38px;height:38px;flex:0 0 auto;display:inline-flex;align-items:center;
    justify-content:center;border:1px solid var(--line);background:var(--surface);color:var(--fg);
    font-family:var(--mono);font-size:15px;line-height:1}
  .hl-arrow:hover{background:var(--hover)}
  .hl-dots{display:flex;align-items:center;gap:2px}
  .hl-dot{width:24px;height:32px;padding:0;border:0;background:transparent;
    display:inline-flex;align-items:center;justify-content:center}
  .hl-dot span{width:8px;height:8px;display:block;border:1px solid var(--line-strong)}
  .hl-dot:hover span{border-color:var(--fg)}
  .hl-dot[aria-current="true"] span{background:var(--fg);border-color:var(--fg)}
  .hl-toggle{height:32px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;
    border:1px solid var(--line);background:var(--surface);color:var(--fg-2);
    font-family:var(--mono);font-size:11px;letter-spacing:.06em}
  .hl-toggle:hover{background:var(--hover);color:var(--fg)}
}
@media (max-width:640px){
  /* 手机再收一档：留白、报头两行、卡片内距 */
  .wrap,.mast-in,.console-in,.foot-in{padding-left:16px;padding-right:16px}
  .brand-name{font-size:18px}
  .edition{display:none}

  /* 手机没有横向空间给省略号，同题标题改为换行显示完整标题 */
  .lead-cross-list .cross-title{white-space:normal;overflow:visible;text-overflow:clip;
    overflow-wrap:anywhere}

  /* 报头改两行。真机 393px 实测：单行时站名会画出自己的盒子、压在搜索框上 12px ——
     根因是 .mast-left{min-width:0} 允许左栏被压扁，而里面的 .brand{flex-shrink:0}
     拒绝收缩；内容溢出父盒照样绘制，于是「文字压住输入框」。分两行后左右两侧不再争宽度，
     构造上不可能再压。Ctrl K 是桌面键盘提示，触屏上既无意义又会挤掉占位文字，一并隐藏。 */
  .kbd{display:none}
  .mast-in{flex-wrap:wrap;gap:4px;padding-top:2px;padding-bottom:4px}
  .mast-left{flex:1 1 100%;gap:10px}
  .mast-right{flex:1 1 100%;gap:6px;min-width:0}
  .searchbox{flex:1 1 auto;min-width:0}
  .searchbox input{width:100%;height:36px;font-size:13px;padding:0 12px 0 28px}
  .searchbox svg{left:9px;width:14px;height:14px}
  /* 两行报头压在 80px 以内（粘在顶部的东西不该抢屏）：站名行 32px 是触控下限不能动，
     就收内距与行距，图标按钮 38 → 36 */
  .icon-btn{width:36px;height:36px}

  /* 区块标题：桌面是「标题 —— 右对齐英文小标签」，手机那行小标签会把左侧说明挤成窄条，
     改为竖排，说明文字拿满整行 */
  .deck{flex-direction:column;align-items:flex-start;gap:8px}
  .deck-left{width:100%}
  .deck-sub{flex:1 1 100%}
  .deck-right{white-space:normal}

  /* 统计条在手机上必然折行，折行后行尾会挂一个孤零零的「·」——
     改为靠 flex 间距分隔，分隔符在窄屏隐藏 */
  .ledger-l{row-gap:6px}
  .ledger-l .sep{display:none}

  /* 手机字号体系：桌面那套是给宽栏排的（头条 27/31px、卡片 17px、正文 12px、行高 1.28），
     搬到 358px 栏宽里就成了「巨大标题 + 密集小字」，层级也倒挂（「今日重点」24px 比站名 18px 还大）。
     这里统一收一档并放松行高，中文长标题才不糊成一片。
     注意：CSS 里那条 .lead-hero .sum 从未生效 —— JS 渲染出来的类名是 lead-sum，
     所以头条正文一直继承 body 的 13px 无衬线。这里按类名写对，手机端先修。 */
  .deck h2{font-size:20px}
  .deck-sub{font-size:12.5px;line-height:1.65}
  /* 元信息行：「NO.016.19 6.19 · TMTPost · 14 小时前 · 2 个独立来源」。
     CSS 里那条 .lead-no 从未生效 —— JS 渲染出来的类名是 lead-meta，所以这行一直是
     继承 body 的 13px 无衬线（编号也没加粗）。手机端按真实类名写，并改成可换行的等宽小字 */
  .lead-meta{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;
    font-family:var(--mono);font-size:11.5px;line-height:1.55;color:var(--fg-2);margin-bottom:10px}
  .lead-meta .no{font-weight:600;color:var(--fg)}
  .lead-meta .sep{color:var(--fg-dim)}
  .lead-hero{padding:18px}
  .lead-hero h3{font-size:19px;line-height:1.45;letter-spacing:0}
  .lead-hero .lead-sum{font-family:var(--serif);font-size:14px;line-height:1.8;color:var(--fg-2)}
  /* 这一列两侧被来源标签和时间夹着，标题列宽本来就窄；字号一涨就多折一行、
     末尾只剩一个字（实测过 12.5px 的样子），所以这里保持 12px 不动 */
  .lead-cross-list li{font-size:12px}

  /* 卡片与特稿：内距收一档，把省下的宽度让给标题与摘要（缩略图尺寸不动，太小反而看不清）。
     正文提到 13px 后，卡片的最小内容宽涨到 352px —— 手机只有一列，而 1fr 的自动最小值
     （min-content）取的就是它，于是在 360px 视口上轨道被顶到 352、溢出屏幕 9px。
     用 minmax(0,1fr) 把自动最小值钉死为 0，再给卡片 min-width:0 兜底；
     标题与摘要是 line-clamp 的收缩盒，会在窄框里正常截断，不会画到卡片外面。 */
  .cards{grid-template-columns:minmax(0,1fr)}
  .card{min-width:0;padding:16px}
  .card h3{font-size:16px;line-height:1.5}
  .card p{font-size:13px;line-height:1.75}
  .lead-item{padding:16px}
  .lead-item h4{font-size:15px;line-height:1.5}
  .lead-item p{font-size:12.5px;line-height:1.75}
  .lead-mini h5{font-size:14.5px;line-height:1.5}

  /* 轮播在手机上再收一档：整条高度由最高那屏（头条）决定，矮的那几屏内容堆在顶部、
     标签行钉在底部（见上面 №4 的说明），余量因此集中在一条空档里而不是散成几块。
     所以只要把头条收住，整条就收住了 —— 头条的配图已在窄屏收起，标题 3 行、正文 4 行，
     都用省略号收（看到「…」就知道还有内容，完整版在原文与下方列表里）。
     矮的那几屏把字号提一档：不然在一屏大框里就是一行小字，没有 Banner 的分量。 */
  #highlights .lead-item h4,#highlights .lead-mini h5{font-size:19px;line-height:1.45}
  /* 第四版定的手机字号（头条 19px）不能被上面那条 id 选择器盖掉 —— 第四版的
     「头条字体太大」就是这条断言盯的，窄屏轮播不该把它改回去。 */
  #highlights .lead-hero h3{font-size:19px}
  #highlights .lead-item p{font-size:14.5px;line-height:1.7;-webkit-line-clamp:8}
  .foot-in{padding-top:22px;padding-bottom:22px}
}
@media print{.masthead,.console,.mast-actions{display:none}}
</style>

/* localStorage 键名。`ai-intel-last-visit` 与 `ai-intel-read` 两个字面量被

const HOUR = 3600e3, DAY = 24 * HOUR;

/* 阅读账本。已读集合与「只看未读」共用同一份数据，不存在两套口径。 */
const visitState = { lastVisit: null, read: new Set(), bookmarks: new Set(), newCount: 0, hasPrev: false };

/* ---------------- 小工具 ---------------- */
const $ = (id) => document.getElementById(id);

/* 一律用 createElement + textContent 组装 DOM，不拼 innerHTML：
   标题/摘要/来源名都来自外部 feed，拼字符串等于把注入面留给上游。 */
function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}
function button(cls, text, aria) {
  const node = el("button", cls, text);
  node.type = "button";
  if (aria) node.setAttribute("aria-label", aria);
  return node;
}
function link(cls, text, href) {
  const node = el("a", cls, text);
  node.href = href;
  return node;
}
function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

/* ---------------- 时间：一律按北京时区（UTC+8）呈现 ---------------- */
function parseTime(value) {
  const ms = Date.parse(value || "");
  return Number.isFinite(ms) ? ms : null;
}
const p2 = (n) => String(n).padStart(2, "0");
function beijing(ms) {
  const d = new Date(ms + 8 * HOUR);  // 固定偏移：中国大陆不实行夏令时，无需时区库
  return { y: d.getUTCFullYear(), mo: d.getUTCMonth() + 1, d: d.getUTCDate(),
           h: d.getUTCHours(), mi: d.getUTCMinutes() };
}
function fmtStamp(ms) {
  if (ms == null) return "时间未知";
  const t = beijing(ms);
  return `${t.y}-${p2(t.mo)}-${p2(t.d)} ${p2(t.h)}:${p2(t.mi)}`;
}
function editionOf(ms) {
  if (ms == null) return "EDITION // —";
  const t = beijing(ms);
  return `EDITION // ${t.y}.${t.mo} · 第 ${Math.floor((ms - Date.UTC(t.y, 0, 1)) / DAY) + 1} 期`;
}
/* 相对时间用「此刻」而不是数据生成时刻：读者关心的是「离我多久」。
   但窗口类筛选（今天 / 近 7 天）用 generated_at 作基准，口径才与管线一致。 */
function relTime(ms, now) {
  // 缺失时只说「发布时间未知」，绝不拿 first_seen_at（采集时间）顶上去冒充发布时间
  if (ms == null) return "发布时间未知";
  const diff = now - ms;
  if (diff < 60e3) return diff < 0 ? "刚刚" : "1 分钟内";
  const min = Math.floor(diff / 60e3);
  if (min < 60) return `${min} 分钟前`;
  const h = Math.floor(min / 60);
  if (h < 24) return `${h} 小时前`;
  const d = Math.floor(h / 24);
  if (d < 30) return `${d} 天前`;
  return fmtStamp(ms).slice(0, 10);
}

/* ---------------- 来源视觉标识（纯本地推导，不引任何图标库） ----------------
   色相由来源 id 哈希得出：同一个源在任何位置颜色都一致，无需配置表。 */
function hueOf(seed) {
  let h = 0;
  for (const ch of String(seed || "?")) h = (h * 31 + ch.codePointAt(0)) % 360;
  return h;
}
function monogram(name) {
  const words = String(name || "?").replace(/[^A-Za-z0-9 ]/g, " ").trim().split(/\s+/).filter(Boolean);
  if (!words.length) return "??";
  if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
  return (words[0][0] + words[1][0]).toUpperCase();
}

/* ---------------- 来源简介：验收条款 02 的兜底文案 ----------------
   条款要求「每条资讯展示标题、简短摘要或来源简介」。实测 85 / 398 条来自源站 feed
   未提供摘要，这些卡片原先只有标题。这里按 source_id 补一句**关于这个源是什么的说明**，
   只说订阅配置里能核实的属性（语言 / 类型 / 是否官方 / 是否做相关性过滤），
   不描述任何文章内容 —— 界面上一律以「来源简介：」开头，与「摘要：来源 feed 原文」显式区分，
   读者不会把我们的说明误当成文章摘要。 */
const SOURCE_BLURB = {

  "tmtpost": "中文财经科技媒体，本站对该源做 AI 相关性过滤",
  "openai": "OpenAI 官方新闻源",
  "google-ai": "Google 官方 AI 博客",
  "techcrunch-ai": "TechCrunch 的 AI 频道",

  "mit-techreview-ai": "MIT Technology Review 的 AI 频道",
  "simonw": "Simon Willison 的博客，本站对该源做 AI 相关性过滤",
  "hn": "Hacker News 热度榜（Algolia API，附分数与评论数）",
